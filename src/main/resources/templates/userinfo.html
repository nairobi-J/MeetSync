<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - MeetSync</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
            min-height: 100vh;
        }

        .profile-card {
            background: white;
            width: 100%;
            max-width: 450px; /* Professional width */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .profile-card h1 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 8px;
        }

        .profile-card p.subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .image-container {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            padding: 3px;
        }

        .edit-photo-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #3b82f6;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid white;
            transition: 0.3s;
        }

        .edit-photo-btn:hover { background: #2563eb; }


        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            color: #1f2937;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            padding-right: 35px;
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Read only email style */
        .input-wrapper input[readonly] {
            background-color: #f9fafb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .pen-icon {
            position: absolute;
            right: 12px;
            color: #9ca3af;
            font-size: 12px;
            pointer-events: none; /* Icon won't block clicks */
        }


        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-save {
            flex: 2;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save:hover { background-color: #2563eb; }

        .btn-cancel {
            flex: 1;
            background-color: white;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-cancel:hover { background-color: #f9fafb; }

        /* Success Message Overlay */
        .alert-success {
            background: #ecfdf5;
            color: #065f46;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <h1>Account Settings</h1>
    <p class="subtitle">Update your profile information</p>

    <!-- Success Message -->
    <div th:if="${param.success}" class="alert-success">
        <i class="fas fa-check-circle"></i> Profile updated successfully!
    </div>

    <form th:action="@{/profile/update}" method="post" enctype="multipart/form-data">

        <!-- Profile Picture Section -->
        <div class="image-container">
            <img th:src="${currentUser.profilePic}"
                 id="profilePreview"
                 class="profile-img"
                 referrerpolicy="no-referrer"
                 alt="Profile">

            <label for="fileInput" class="edit-photo-btn">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="fileInput" name="profilePic" style="display: none;" onchange="previewImage(event)">
        </div>

        <!-- Name Field -->
        <div class="form-group">
            <label>FULL NAME</label>
            <div class="input-wrapper">
                <input type="text" name="name" th:value="${currentUser.name}" required>
                <i class="fas fa-pen pen-icon"></i>
            </div>
        </div>

        <!-- Email Field (Read Only) -->
        <div class="form-group">
            <label>EMAIL ADDRESS</label>
            <div class="input-wrapper">
                <input type="email" th:value="${currentUser.email}" readonly>
            </div>
        </div>

        <!-- Timezone Field -->
        <div class="form-group">
            <label>TIMEZONE</label>
            <div class="input-wrapper">
                <select name="timezone">
                    <option th:each="tz : ${timezones}"
                            th:value="${tz}"
                            th:text="${tz}"
                            th:selected="${tz == currentUser.timezone}"></option>
                </select>
                <i class="fas fa-chevron-down pen-icon"></i>
            </div>
        </div>

        <div class="button-group">
            <button type="button" class="btn-cancel" onclick="window.history.back()">Back</button>
            <button type="submit" class="btn-save">Save Changes</button>
        </div>
    </form>
</div>

<script>
    // Live preview of the image before uploading
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('profilePreview');
            output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

</body>
</html>
