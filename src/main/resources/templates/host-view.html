<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Host View | MeetSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Selection & Heatmap Styles */
        .personal-cell.selected {
            background-color: #3b82f6 !important;
            box-shadow: inset 0 0 0 2px #2563eb;
        }
        .heat-0 { background-color: #f8fafc; }
        .heat-1 { background-color: #dcfce7; }
        .heat-2 { background-color: #86efac; }
        .heat-3 { background-color: #22c55e; }

        .tooltip {
            visibility: hidden; position: absolute; z-index: 50;
            background: #0f172a; color: white; padding: 8px 12px;
            border-radius: 8px; font-size: 11px; pointer-events: none;
            white-space: pre-line; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .has-tooltip:hover .tooltip { visibility: visible; bottom: 110%; left: 50%; transform: translateX(-50%); }

        /* Fast Scroll Containers */
        .sync-scroll-container {
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .sync-scroll-container::-webkit-scrollbar { display: none; }
        .no-select { user-select: none; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen no-select">

<div id="screen-loader" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[100] flex items-center justify-center transition-all duration-300">
    <div class="bg-white p-10 rounded-3xl shadow-2xl flex flex-col items-center">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="font-black text-slate-800 tracking-tight">Syncing your schedule...</p>
    </div>
</div>

<nav class="bg-white border-b border-slate-200 px-8 py-4 mb-6 sticky top-0 z-50">
    <div class="max-w-[1600px] mx-auto flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200 font-bold">M</div>
            <h1 class="text-xl font-bold text-slate-900" th:text="${event.title}"></h1>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                <button onclick="fastSyncScroll(-600)" class="p-2 hover:bg-white hover:shadow-md rounded-lg transition-all text-slate-500 hover:text-blue-600 active:scale-75">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                </button>
                <button onclick="fastSyncScroll(600)" class="p-2 hover:bg-white hover:shadow-md rounded-lg transition-all text-slate-500 hover:text-blue-600 active:scale-75">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
                </button>
            </div>
            <button onclick="submitAvailability()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition active:scale-95">Save & Exit</button>
        </div>
    </div>
</nav>

<div class="max-w-[1600px] mx-auto px-6 pb-12">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-5 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">1. Your Availability</h3>
            </div>
            <div class="flex">
                <div class="w-20 bg-white border-r border-slate-100 flex-shrink-0 z-10">
                    <div class="h-14 border-b"></div>
                    <div th:each="time : ${hours}" class="h-12 border-b border-slate-50 flex items-center justify-center text-[10px] font-bold text-slate-400 uppercase" th:text="${#temporals.format(time, 'h a')}"></div>
                </div>
                <div id="scroll-personal" class="sync-scroll-container flex-1 flex overflow-x-auto">
                    <div th:each="date : ${#lists.sort(#lists.toList(#sets.toSet(event.slots.![slotDate])))}" class="flex-1 min-w-[125px] border-r border-slate-50">
                        <div class="h-14 border-b border-slate-100 flex flex-col items-center justify-center bg-slate-50/20">
                            <span class="text-[11px] font-black text-slate-900 uppercase" th:text="${#temporals.format(date, 'EEE')}"></span>
                            <span class="text-[11px] text-slate-400 font-bold" th:text="${#temporals.format(date, 'd')}"></span>
                        </div>
                        <div th:each="time : ${hours}">
                            <div th:each="slot : ${event.slots}"
                                 th:if="${slot.slotDate == date && slot.startTime == time}"
                                 class="personal-cell h-12 border-b border-slate-50 cursor-pointer"
                                 th:classappend="${savedHostSlotIds != null && #lists.contains(savedHostSlotIds, slot.id)} ? 'selected' : ''"
                                 th:attr="data-slot-id=${slot.id}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-5 border-b border-slate-50 bg-slate-50/50">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">2. Group Heatmap (Live)</h3>
            </div>
            <div class="flex">
                <div class="w-20 bg-white border-r border-slate-100 flex-shrink-0 z-10">
                    <div class="h-14 border-b"></div>
                    <div th:each="time : ${hours}" class="h-12 border-b border-slate-50 flex items-center justify-center text-[10px] font-bold text-slate-400 uppercase" th:text="${#temporals.format(time, 'h a')}"></div>
                </div>
                <div id="scroll-heatmap" class="sync-scroll-container flex-1 flex overflow-x-auto">
                    <div th:each="date : ${#lists.sort(#lists.toList(#sets.toSet(event.slots.![slotDate])))}" class="flex-1 min-w-[125px] border-r border-slate-50">
                        <div class="h-14 border-b border-slate-100 flex flex-col items-center justify-center bg-slate-50/20">
                            <span class="text-[11px] font-black text-slate-900 uppercase" th:text="${#temporals.format(date, 'EEE')}"></span>
                            <span class="text-[11px] text-slate-400 font-bold" th:text="${#temporals.format(date, 'd')}"></span>
                        </div>
                        <div th:each="time : ${hours}">
                            <div th:each="slot : ${event.slots}"
                                 th:if="${slot.slotDate == date && slot.startTime == time}"
                                 class="heat-cell has-tooltip h-12 border-b border-slate-50 relative"
                                 th:attr="data-slot-id=${slot.id}">
                                <div class="tooltip shadow-xl">No one</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let isMouseDown = false;
    let selectedSlotIds = new Set();
    const heatmapData = [(${heatmapDataJson})];

    /*[# th:each="id : ${savedHostSlotIds}"]*/
    selectedSlotIds.add(String([[${id}]]));
    /*[/]*/

    // --- Vibration-Free Synchronized Scrolling ---
    const personal = document.getElementById('scroll-personal');
    const heatmap = document.getElementById('scroll-heatmap');
    let isSyncingPersonal = false;
    let isSyncingHeatmap = false;

    personal.onscroll = () => {
        if (!isSyncingPersonal) {
            isSyncingHeatmap = true;
            heatmap.scrollLeft = personal.scrollLeft;
        }
        isSyncingPersonal = false;
    };

    heatmap.onscroll = () => {
        if (!isSyncingHeatmap) {
            isSyncingPersonal = true;
            personal.scrollLeft = heatmap.scrollLeft;
        }
        isSyncingHeatmap = false;
    };

    function fastSyncScroll(dist) {
        personal.scrollBy({ left: dist, behavior: 'smooth' });
    }

    // --- Drag Selection Logic ---
    document.querySelectorAll('.personal-cell').forEach(cell => {
        cell.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            toggleSlot(cell);
            e.preventDefault();
        });
        cell.addEventListener('mouseenter', () => { if (isMouseDown) toggleSlot(cell); });
    });
    window.addEventListener('mouseup', () => isMouseDown = false);

    function toggleSlot(cell) {
        const id = cell.dataset.slotId;
        if (selectedSlotIds.has(id)) {
            selectedSlotIds.delete(id);
            cell.classList.remove('selected');
        } else {
            selectedSlotIds.add(id);
            cell.classList.add('selected');
        }
        updateHeatmapUI();
    }

    function updateHeatmapUI() {
        document.querySelectorAll('.heat-cell').forEach(heatCell => {
            const id = heatCell.dataset.slotId;
            let voters = heatmapData[id] ? [...heatmapData[id]] : [];
            if (selectedSlotIds.has(id)) {
                if (!voters.includes("You (Host)")) voters.push("You (Host)");
            } else {
                voters = voters.filter(v => v !== "You (Host)");
            }
            const count = voters.length;
            heatCell.className = 'heat-cell has-tooltip h-12 border-b border-slate-50 relative transition-all heat-' + Math.min(count, 3);
            heatCell.querySelector('.tooltip').innerText = count > 0 ? count + " available:\n" + voters.join('\n') : "No one";
        });
    }

    function submitAvailability() {
        // Show Loader
        document.getElementById('screen-loader').classList.remove('hidden');

        const formData = new URLSearchParams();
        selectedSlotIds.forEach(id => formData.append('slotIds', id));
        fetch(window.location.pathname + '/host-availability', {
            method: 'POST',
            body: formData
        }).then(res => {
            if(res.ok) window.location.href = window.location.pathname + '/overview';
            else document.getElementById('screen-loader').classList.add('hidden');
        });
    }

    updateHeatmapUI();
</script>
</body>
</html>
