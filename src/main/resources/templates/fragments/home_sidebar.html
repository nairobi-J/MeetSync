<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Sidebar Fragment -->
    <aside th:fragment="sidebar" class="w-64 bg-white border-r border-gray-200 fixed left-0 top-16 bottom-0 overflow-y-auto">
        <div class="p-4">
            <!-- Schedule New Button -->
            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center space-x-2 mb-6">
                <i class="fas fa-plus"></i>
                <span>Schedule New</span>
            </button>

            <!-- Mini Calendar -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-4">
                    <button id="prevMonth" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h3 id="miniCalendarMonth" class="font-semibold text-gray-900">February 2021</h3>
                    <button id="nextMonth" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs">
                    <!-- Day Headers -->
                    <div class="text-gray-500 font-medium py-2">MON</div>
                    <div class="text-gray-500 font-medium py-2">TUE</div>
                    <div class="text-gray-500 font-medium py-2">WED</div>
                    <div class="text-gray-500 font-medium py-2">THU</div>
                    <div class="text-gray-500 font-medium py-2">FRI</div>
                    <div class="text-gray-500 font-medium py-2">SAT</div>
                    <div class="text-gray-500 font-medium py-2">SUN</div>

                    <!-- Calendar Days -->
                    <div id="miniCalendarDays" class="col-span-7 grid grid-cols-7 gap-1">
                        <!-- Days will be generated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Main Navigation -->
            <div class="mb-6">
                <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3">MAIN</h4>
                <nav class="space-y-1">
                    <a th:href="@{/dashboard}" class="flex items-center space-x-3 px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-home w-5"></i>
                        <span>Dashboard</span>
                    </a>
<!--                    th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/events') ? 'bg-blue-100 text-blue-600' : ''}"-->
                    <a th:href="@{/events} "
                       class="flex items-center space-x-3 px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="far fa-calendar-alt w-5"></i>
                        <span>Events</span>
                    </a>
                    <a th:href="@{/availability}" class="flex items-center space-x-3 px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="far fa-calendar w-5"></i>
                        <span>Availability</span>
                    </a>
                </nav>
            </div>

            <!-- Settings Navigation -->
            <div class="mb-6">
                <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3">SETTINGS</h4>
                <nav class="space-y-1">
                    <a href="#" class="flex items-center space-x-3 px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="far fa-bell w-5"></i>
                        <span>Notification</span>
                    </a>
                    <button class="w-full flex items-center justify-between px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <div class="flex items-center space-x-3">
                            <i class="fas fa-cog w-5"></i>
                            <span>Settings</span>
                        </div>
                        <i class="fas fa-chevron-down text-xs"></i>
                    </button>
                </nav>
            </div>
        </div>
    </aside>
</body>
</html>
