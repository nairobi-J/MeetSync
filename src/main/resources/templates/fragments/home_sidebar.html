<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <script th:src="@{/js/sidebar_toggle.js}" defer></script>
</head>

<body>
    <!-- Mobile Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden hidden"
        onclick="toggleSidebar()"></div>

    <!-- Sidebar Fragment -->
    <aside id="sidebar" th:fragment="sidebar"
        class="w-64 bg-white border-r border-gray-200 fixed left-0 top-16 bottom-0 overflow-y-auto  transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="p-4">
            <!-- Schedule New Button -->
            <div class="relative  mb-6">
                <button id="scheduleDropdownBtn" type="button"
                    class="w-full bg-blue-600 mt-4 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <i class="fas fa-plus"></i>
                    <span>Schedule New</span>
                    <i id="scheduleDropdownIcon"
                        class="fas fa-chevron-down ml-2 text-xs transition-transform duration-200"></i>
                </button>
                <div id="scheduleDropdownMenu" class="overflow-hidden transition-all duration-300 max-h-0 mt-2    z-0">
                    <a href="/event-create"
                        class="block px-4 py-3 text-gray-700 hover:bg-blue-50   flex items-center space-x-2">
                        <i class="fas fa-users mr-2 "></i>
                        <span>Event Poll Scheduling</span>
                    </a>
                    <a href="/availability/setup"
                        class="block px-4 py-3 text-gray-700 text-base hover:bg-blue-50  flex items-center space-x-2">
                        <i class="fas fa-user-check mr-2 "></i>
                        <span>One-to-One Appointment</span>
                    </a>
                </div>
                <script>
                    // Collapsible dropdown logic
                    (function () {
                        const btn = document.getElementById('scheduleDropdownBtn');
                        const menu = document.getElementById('scheduleDropdownMenu');
                        const icon = document.getElementById('scheduleDropdownIcon');
                        let expanded = false;
                        if (btn && menu) {
                            btn.addEventListener('click', function (e) {
                                e.stopPropagation();
                                expanded = !expanded;
                                if (expanded) {
                                    menu.classList.remove('max-h-0');

                                    menu.classList.add('max-h-40');


                                    icon.classList.add('rotate-180');
                                } else {
                                    menu.classList.remove('max-h-40');
                                    menu.classList.add('max-h-0');
                                    icon.classList.remove('rotate-180');
                                }
                            });
                            document.addEventListener('click', function (e) {
                                if (expanded && !btn.contains(e.target) && !menu.contains(e.target)) {
                                    expanded = false;
                                    menu.classList.remove('max-h-40');

                                    menu.classList.add('max-h-0');
                                    icon.classList.remove('rotate-180');
                                }
                            });
                        }
                    })();
                </script>
            </div>

            <!-- Mini Calendar -->
            <div class="mb-6" th:if="${activePage == 'dash'}">
                <div class="flex items-center justify-between mb-4">
                    <button id="prevMonth" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h3 id="miniCalendarMonth" class="font-semibold text-gray-900">February 2021</h3>
                    <button id="nextMonth" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs">
                    <!-- Day Headers -->
                    <div class="text-gray-500 font-medium py-2">MON</div>
                    <div class="text-gray-500 font-medium py-2">TUE</div>
                    <div class="text-gray-500 font-medium py-2">WED</div>
                    <div class="text-gray-500 font-medium py-2">THU</div>
                    <div class="text-gray-500 font-medium py-2">FRI</div>
                    <div class="text-gray-500 font-medium py-2">SAT</div>
                    <div class="text-gray-500 font-medium py-2">SUN</div>

                    <!-- Calendar Days -->
                    <div id="miniCalendarDays" class="col-span-7 grid grid-cols-7 gap-1">
                        <!-- Days will be generated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Main Navigation -->
            <div class="mb-6">
                <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3">MAIN</h4>
                <nav class="space-y-1">
                    <a th:href="@{/dashboard}"
                        th:classappend="${activePage == 'dash'} ? 'bg-blue-100 text-blue-600' : 'text-gray-700'"
                        class="flex items-center space-x-3 px-3 py-2 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-calendar w-5"
                            th:classappend="${activePage == 'dash'} ? 'text-blue-600' : ''"></i>
                        <span>Calendar</span>
                    </a>
                    <a th:href="@{/events}"
                        th:classappend="${activePage == 'events'} ? 'bg-blue-100 text-blue-600' : 'text-gray-700'"
                        class="flex items-center space-x-3 px-3 py-2 hover:bg-gray-100 rounded-lg">
                        <i class="far fa-calendar-alt w-5"
                            th:classappend="${activePage == 'events'} ? 'text-blue-600' : ''"></i>
                        <span>Events</span>
                    </a>

                </nav>
            </div>

            <!-- Settings Navigation -->
            <div class="mb-6">
                <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3">SETTINGS</h4>
                <nav class="space-y-1">
                    <a th:href="@{/availability/setup}"
                        th:classappend="${activePage == 'availability'} ? 'bg-blue-100 text-blue-600' : 'text-gray-700'"
                        class="flex items-center space-x-3 px-3 py-2 hover:bg-gray-100 rounded-lg">
                        <i class="fa-solid fa-clock"
                            th:classappend="${activePage == 'availability'} ? 'text-blue-600' : ''"></i>
                        <span>Availability</span>
                    </a>

                    <a th:href="@{/profile}"
                        th:classappend="${activePage == 'profile'} ? 'bg-blue-100 text-blue-600' : 'text-gray-700'"
                        class="flex items-center space-x-3 px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition">
                        <i class="fa-solid fa-user"
                            th:classappend="${activePage == 'profile'} ? 'text-blue-600' : ''"></i>
                        <span th:classappend="${activePage == 'profile'} ? 'text-blue-600' : ''">Profile</span>
                    </a>



                    <!-- <button
                        class="w-full flex items-center justify-between px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">
                        <div class="flex items-center space-x-3">
                            <i class="fas fa-cog w-5"></i>
                            <span>Settings</span>
                        </div>
                        <i class="fas fa-chevron-down text-xs"></i>
                    </button> -->
                </nav>
            </div>



            <form th:action="@{/logout}" method="post"
      class="absolute bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200">
    <button type="submit"
        class="w-full flex items-center justify-center gap-2 bg-red-50 text-red-600 hover:bg-red-100 font-medium py-3 px-4 rounded-lg transition">
        <!-- Logout SVG Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1"/>
        </svg>
        Sign out
    </button>
</form>
        </div>
    </aside>
    <script>
        function toggleScheduleDropdown() {
            const menu = document.getElementById('scheduleDropdownMenu');
            menu.classList.toggle('hidden');
            // Optional: close dropdown when clicking outside
            document.addEventListener('click', function handler(e) {
                if (!e.target.closest('#scheduleDropdownBtn')) {
                    menu.classList.add('hidden');
                    document.removeEventListener('click', handler);
                }
            });
        }
    </script>
</body>

</html>
