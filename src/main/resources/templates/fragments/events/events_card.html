<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="event_card(event)" class="event-card bg-white rounded-lg border border-gray-200 hover:shadow-lg transition">

    <div class="p-6 border-b border-gray-200">
        <div class="flex items-start justify-between mb-4">
            <h3 class="text-lg font-bold text-gray-900 flex-1" th:text="${event.title}">Project Alpha Sync-up</h3>
            <i class="fas fa-video text-blue-500"></i>
        </div>

        <div class="space-y-2 text-sm text-gray-600">
            <!-- Date Section -->
            <div class="flex items-center space-x-2">
                <i class="far fa-calendar w-4"></i>
                <!-- Show confirmed date if event is confirmed -->
                <span th:if="${event.isConfirmed()}" th:text="${#temporals.format(event.confirmedDate, 'EEE, MMM d, yyyy')}">Mon, Oct 26, 2023</span>
                <!-- Show TBD if event is pending -->
                <span th:unless="${event.isConfirmed()}" class="text-gray-400 italic">Date TBD - Collecting votes</span>
            </div>

            <!-- Time Section -->
            <div class="flex items-center space-x-2">
                <i class="far fa-clock w-4"></i>
                <!-- Show confirmed time if event is confirmed -->
                <span th:if="${event.isConfirmed()}">
                    <span th:text="${#temporals.format(event.confirmedStartTime, 'h:mm a')}"></span>
                    <span> - </span>
                    <span th:text="${#temporals.format(event.confirmedEndTime, 'h:mm a')}"></span>
                    
                    <span> (</span><span th:text="${event.slotDuration}"></span><span> min)</span>
                </span>

                <!-- Show time range if event is pending -->
                <span th:unless="${event.isConfirmed()}" class="text-gray-400 italic">
                    <span th:text="${#temporals.format(event.earliestTime, 'h:mm a')}"></span>
                    <span> - </span>
                    <span th:text="${#temporals.format(event.latestTime, 'h:mm a')}"></span>
                    <span> available</span>
                </span>
            </div>
        </div>
    </div>

    <div class="p-6 flex items-center justify-between">
        <!-- Status Badge - Dynamic based on confirmation -->
        <span th:if="${event.isConfirmed()}" class="px-3 py-1 bg-green-100 text-green-700 text-xs font-semibold rounded-full">
            ✓ Confirmed
        </span>
        <span th:unless="${event.isConfirmed()}" class="px-3 py-1 bg-yellow-100 text-yellow-700 text-xs font-semibold rounded-full">
            ⏳ Pending
        </span>

        <div class="flex gap-2 items-center">
            <!--/*@thymesVar id="shareLink" type=""*/-->
            <a th:href="@{'/event/' + ${event.shareLink} + '/overview'}"
               class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-lg border border-gray-300 transition">
                View Details
            </a>
            
            <!-- Delete Button -->
            <form th:action="@{/events/{id}/delete(id=${event.id})}" method="post" 
                  th:data-event-title="${event.title}"
                  onsubmit="return confirmDelete(this);"
                  style="display: inline;">
                <button type="submit" 
                        class="p-2 text-red-600 hover:text-red-800 hover:bg-red-50 rounded-lg transition"
                        title="Delete event">
                    <i class="fas fa-trash"></i>
                </button>
            </form>
        </div>

    </div>
</div>

<script>
function confirmDelete(form) {
    // Get event title from data attribute
    const eventTitle = form.getAttribute('data-event-title');
    
    const message = `Are you sure you want to delete "${eventTitle}"?\n\n` +
                   `This will:\n` +
                   `• Remove all time slots\n` +
                   `• Delete all participant responses\n` +
                   `• This action cannot be undone!\n\n` +
                   `Do you want to continue?`;
    
    return confirm(message);
}
</script>

</body>
</html>
