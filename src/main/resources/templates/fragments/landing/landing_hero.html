<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- Hero Section Fragment -->
    <section th:fragment="hero" class="  pt-24 pb-16 px-6">
        <div class="max-w-7xl  mx-auto">
            <div class="grid md:grid-cols-2 gap-12 items-center">

                <!-- Left Content -->
                <div class="space-y-6">
                    <h1 class="text-5xl md:text-6xl font-bold text-gray-900 leading-tight">
                        Schedule meetings without the back-and-forth.
                    </h1>

                    <p class="text-lg text-gray-600 leading-relaxed">
                        MeetSync is the modern scheduling platform that makes finding time a breeze.
                        Whether for 1:1 catch-ups or group sessions, streamline your calendar today.
                    </p>

                    <div>
                        <th:block th:if="${currentUser == null}">
                            <a th:href="@{/oauth2/authorization/google}"
                                class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-4 rounded-lg transition transform hover:scale-105">
                                Get Started
                            </a>
                        </th:block>

                        <th:block th:if="${currentUser != null}">
                            <a th:href="@{/dashboard}"
                                class="inline-block my-12 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-4 rounded-lg  transform hover:scale-105">
                                Go to Dashboard
                            </a>
                        </th:block>
                    </div>
                </div>

                <!-- Right Content - Banner -->
                <div>
                    <img src="/assets/events.png" alt="Demo Calendar" class="w-3/5 h-auto rounded-lg">
                </div>

            </div>
        </div>
    </section>
</body>

</html>
