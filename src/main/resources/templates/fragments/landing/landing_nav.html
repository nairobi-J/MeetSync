<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Landing Navbar Fragment -->
    <nav th:fragment="navbar" class="bg-white border-b border-gray-200 fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <!-- Logo -->
                <div class="flex items-center">
                    <a th:href="@{/landing}" class="text-2xl font-bold text-blue-600">MeetSync</a>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-8">
                    <a th:href="@{/landing}" class="text-gray-700 hover:text-blue-600 transition">Home</a>
                    <a href="#features" class="text-gray-700 hover:text-blue-600 transition">Features</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600 transition">About Us</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600 transition">Members</a>
                </div>
                
                <!-- Auth Buttons -->
                <div class="hidden md:flex items-center space-x-4">
                    <a th:href="@{/login}" class="text-gray-700 hover:text-blue-600 px-4 py-2 rounded-lg transition">
                        Log In
                    </a>
                    <a th:href="@{/signup}" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">
                        Sign Up
                    </a>
                </div>
                
                <!-- Mobile Menu Button -->
                <button id="mobileMenuBtn" class="md:hidden text-gray-700">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
            
            <!-- Mobile Menu -->
            <div id="mobileMenu" class="hidden md:hidden mt-4 pb-4 border-t border-gray-200 pt-4">
                <div class="flex flex-col space-y-4">
                    <a th:href="@{/landing}" class="text-gray-700 hover:text-blue-600 transition">Home</a>
                    <a href="#features" class="text-gray-700 hover:text-blue-600 transition">Features</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600 transition">About Us</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600 transition">Members</a>
                    <div class="flex flex-col space-y-2 pt-4 border-t border-gray-200">
                        <a th:href="@{/login}" class="text-center text-gray-700 hover:text-blue-600 px-4 py-2 rounded-lg border border-gray-300 transition">
                            Log In
                        </a>
                        <a th:href="@{/signup}" class="text-center bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">
                            Sign Up
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
