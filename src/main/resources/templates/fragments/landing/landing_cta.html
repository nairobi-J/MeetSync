<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- CTA Section Fragment -->
    <section th:fragment="cta" class="py-20 px-6 bg-gradient-to-r from-blue-600 to-blue-700">
        <div class="max-w-4xl mx-auto text-center">
            
            <!-- CTA Content -->
            <h2 class="text-4xl md:text-5xl font-bold text-white mb-6">
                Ready to simplify scheduling?
            </h2>
            
            <p class="text-xl text-blue-100 mb-10">
                Join thousands of professionals reclaiming their time.
            </p>
            
            <a th:href="@{/signup}" class="inline-block bg-white text-blue-600 hover:bg-gray-100 font-semibold px-10 py-4 rounded-lg transition transform hover:scale-105 shadow-lg">
                Sign Up Free
            </a>
            
        </div>
    </section>
</body>
</html>
