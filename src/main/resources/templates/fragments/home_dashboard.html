<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Dashboard Fragment -->
    <main th:fragment="dashboard" class="flex-1 ml-64 mt-16 p-8">
        <!-- Header with Month/Year and View Toggles -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-3xl font-bold text-gray-900" id="currentMonthYear">
                December 2025
            </h2>
            
            <div class="flex items-center space-x-4">
                <!-- View Type Buttons -->
                <div class="flex bg-white border border-gray-200 rounded-lg overflow-hidden">
                    <button class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">Day</button>
                    <button class="px-4 py-2 text-sm bg-blue-600 text-white">Week</button>
                    <button class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">Month</button>
                    <button class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">Year</button>
                </div>
                
                <!-- Calendar View / List View Toggle -->
                <div class="flex items-center space-x-2">
                    <button class="flex items-center space-x-2 px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50">
                        <i class="far fa-calendar"></i>
                        <span>Calendar View</span>
                    </button>
                    <button class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50">
                        List View
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Calendar Grid -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <!-- Day Headers -->
            <div class="grid grid-cols-7 border-b border-gray-200">
                <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r border-gray-200">MON</div>
                <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r border-gray-200">TUE</div>
                <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r border-gray-200">WED</div>
                <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r border-gray-200">THU</div>
                <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r border-gray-200">FRI</div>
                <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r border-gray-200">SAT</div>
                <div class="p-4 text-center text-sm font-semibold text-gray-700">SUN</div>
            </div>
            
            <!-- Calendar Days Grid -->
            <div id="calendarGrid" class="grid grid-cols-7">
                <!-- Calendar days will be generated by JavaScript -->
            </div>
        </div>
        
        <!-- Hidden data for JavaScript -->
        <div id="calendarData" 
             th:attr="data-events=${events}"
             style="display: none;">
        </div>
        
        <!-- Demo Events Data (Alternative approach) -->
        <script th:inline="javascript">
            /*<![CDATA[*/
            // Demo data - hardcoded events
            var demoEvents = [
                { day: 1, title: "Quotes", color: "blue" },
                { day: 3, title: "Quotes", color: "blue" },
                { day: 3, title: "Giveaway", color: "orange" },
                { day: 5, title: "Quotes", color: "blue" },
                { day: 5, title: "Giveaway", color: "orange" },
                { day: 7, title: "Quotes", color: "blue" },
                { day: 9, title: "Quotes", color: "blue" },
                { day: 9, title: "Giveaway", color: "orange" },
                { day: 11, title: "Quotes", color: "blue" },
                { day: 13, title: "Quotes", color: "blue" },
                { day: 17, title: "Quotes", color: "blue" },
                { day: 19, title: "Quotes", color: "blue" },
                { day: 19, title: "Giveaway", color: "orange" },
                { day: 19, title: "Reel", color: "red" }
            ];
            
            /*
            // API version - Uncomment when backend is ready
            var apiEvents = [[${events}]];
            
            // Fetch events from API
            async function fetchEvents(year, month) {
                try {
                    const response = await fetch(`/api/events?year=${year}&month=${month}`);
                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('Error fetching events:', error);
                    return [];
                }
            }
            */
            /*]]>*/
        </script>
    </main>
</body>
</html>
