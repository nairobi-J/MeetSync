<main th:fragment="dashboard" class="flex-1 ml-64 mt-16 p-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center justify-between gap-4 w-full max-w-3xl mx-auto">
            <button id="todayBtn" class="px-5 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-lg font-medium">
                Today
            </button>
            <div class="flex items-center space-x-3">
                <button id="prevMainMonth" class="p-2 text-gray-600 hover:text-gray-900 rounded hover:bg-gray-100">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <h2 id="currentMonthYear" class="text-3xl font-bold text-gray-900 text-center min-w-[260px] md:min-w-[320px]">
                <!-- month year -->
            </h2>
            <button id="nextMainMonth" class="p-2 text-gray-600 hover:text-gray-900 rounded hover:bg-gray-100">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="flex items-center space-x-4">
           
            <button class="flex items-center space-x-2 px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50">
                <i class="far fa-calendar"></i>
                <span>Calendar View</span>
            </button>
        </div>
    </div>

    <!-- Calendar Grid -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <div class="grid grid-cols-7 border-b border-gray-200">
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">MON</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">TUE</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">WED</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">THU</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">FRI</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">SAT</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700">SUN</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7"></div>
    </div>

    <!-- Loading Spinner -->
    <div id="calendarLoading" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-full p-6 shadow-lg">
            <svg class="animate-spin h-10 w-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </div>

    <!-- Event Modal -->
  <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg w-96 max-w-full">
        <!-- Modal Header -->
        <div class="flex flex-col border-b border-gray-200 px-4 py-2">
            <h3 id="modalTitle" class="text-lg font-semibold text-gray-900 mb-1">Create an event on this date</h3>
            <div id="modalDate" class="text-sm text-gray-600">Total: 0 events</div>
        </div>
        <!-- Modal Body -->
        <div class="p-4 max-h-80 overflow-y-auto">
            <div id="eventList" class="space-y-3">
                <!-- Event items will be dynamically inserted here -->
             
            </div>
        </div>
        <!-- Modal Footer (optional) -->
        <div class="px-4 py-2 border-t border-gray-200 flex justify-end">
            <button id="closeModal" class="text-gray-600 hover:text-gray-900">
                <i class="fas fa-times"></i> Close
            </button>
        </div>
    </div>
</div>

    <!-- Data -->
    <div id="calendarData"
         data-current-month="[[${currentMonth.monthValue - 1}]]"
         data-current-year="[[${currentYear}]]"
         style="display:none;"></div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let initialEvents = /*[[${events}]]*/ [];
        /*]]>*/
    </script>
</main>
