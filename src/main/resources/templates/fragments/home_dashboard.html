<main th:fragment="dashboard" class="flex-1 ml-64 mt-16 p-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-4">
            <button id="prevMainMonth" class="p-2 text-gray-600 hover:text-gray-900 rounded hover:bg-gray-100">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h2 id="currentMonthYear" class="text-3xl font-bold text-gray-900"></h2>
            <button id="nextMainMonth" class="p-2 text-gray-600 hover:text-gray-900 rounded hover:bg-gray-100">
                <i class="fas fa-chevron-right"></i>
            </button>
            <button id="todayBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Today
            </button>
        </div>

        <div class="flex items-center space-x-4">
            <div class="flex bg-white border border-gray-200 rounded-lg overflow-hidden">
                <button class="px-4 py-2 text-sm bg-blue-600 text-white">Month</button>
            </div>
            <button class="flex items-center space-x-2 px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50">
                <i class="far fa-calendar"></i>
                <span>Calendar View</span>
            </button>
        </div>
    </div>

    <!-- Calendar Grid -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <div class="grid grid-cols-7 border-b border-gray-200">
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">MON</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">TUE</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">WED</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">THU</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">FRI</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700 border-r">SAT</div>
            <div class="p-4 text-center text-sm font-semibold text-gray-700">SUN</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7"></div>
    </div>

    <!-- Loading Spinner -->
    <div id="calendarLoading" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-full p-6 shadow-lg">
            <svg class="animate-spin h-10 w-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </div>

    <!-- Event Modal (dynamic modal) created by JS when needed -->

    <!-- Reusable Event Detail Modal -->
<div id="eventDetailModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full mx-4 overflow-hidden">
        <!-- We'll inject the event-card-like content here via JS -->
        <div id="modalEventContent"></div>
        
        <!-- Close button area -->
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end">
            <button id="closeEventModal" 
                    class="px-5 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-700 transition">
                Close
            </button>
        </div>
    </div>
</div>

    <!-- Data -->
    <div id="calendarData"
         data-current-month="[[${currentMonth.monthValue - 1}]]"
         data-current-year="[[${currentYear}]]"
         style="display:none;"></div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let initialEvents = /*[[${events}]]*/ [];
        /*]]>*/
    </script>
</main>
