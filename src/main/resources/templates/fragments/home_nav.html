<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Navbar Fragment -->
    <nav th:fragment="navbar" class="bg-white border-b border-gray-200 px-6 py-4 fixed w-full top-0 z-50">
        <div class="flex items-center justify-between">
            <!-- Logo and Brand -->
            <div class="flex items-center space-x-4">
                <h1 class="text-2xl font-bold text-gray-900">MeetSync</h1>
                <button class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
            
            <!-- Search Bar -->
            <div class="flex-1 max-w-xl mx-8">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input 
                        type="text" 
                        placeholder="Search" 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
            </div>
            
            <!-- Right Side Icons -->
            <div class="flex items-center space-x-6">
                <!-- Notifications -->
                <a th:href="@{/notifications}" class="text-gray-600 hover:text-gray-900 relative">
                    <i class="far fa-bell text-xl"></i>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-4 w-4 flex items-center justify-center">3</span>
                </a>
                
                <!-- Help -->
                <a href="#" class="text-gray-600 hover:text-gray-900">
                    <i class="far fa-question-circle text-xl"></i>
                </a>
                
                <!-- User Profile -->
                <a href="#" class="text-blue-600 hover:text-blue-700">
                    <i class="far fa-user-circle text-2xl"></i>
                </a>
            </div>
        </div>
    </nav>
</body>
</html>
