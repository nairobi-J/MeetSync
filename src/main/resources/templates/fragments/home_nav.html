<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <script th:src="@{/js/sidebar_toggle.js}" defer></script>
</head>

<body onclick="document.getElementById('userProfileDropdown').classList.add('hidden')">

    <nav th:fragment="navbar" class="bg-white z-50 border-b border-gray-200 px-4 sm:px-6 py-4 fixed w-full top-0">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Hamburger menu for mobile -->
                <div class="relative lg:hidden">
                    <button id="navbarHamburger"
                        onclick="document.getElementById('navbarSidebarDropdown').classList.toggle('hidden')"
                        class="text-gray-600 hover:text-gray-900 focus:outline-none">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <!-- Dropdown menu -->
                    <div id="navbarSidebarDropdown"
                        class="hidden absolute left-0 mt-2 w-56 bg-white rounded-lg shadow-xl border border-gray-200 z-50">
                        <nav class="py-2">
                            <a th:href="@{/dashboard}"
                                class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100">
                                <i class="fas fa-home w-5 mr-2"></i> Dashboard
                            </a>
                            <a th:href="@{/events}" class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100">
                                <i class="far fa-calendar-alt w-5 mr-2"></i> Events
                            </a>
                            <a th:href="@{/availability/setup}"
                                class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100">
                                <i class="far fa-calendar w-5 mr-2"></i> Availability
                            </a>
                            <a th:href="@{/notifications}"
                                class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100">
                                <i class="far fa-bell w-5 mr-2"></i> Notifications
                            </a>
                            <a th:href="@{/profile}"
                                class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100">
                                <i class="far fa-user w-5 mr-2"></i> Profile
                            </a>
                        </nav>
                    </div>
                </div>
                <a th:href="@{/dashboard}"
                    class="px-2 sm:px-10 text-xl sm:text-2xl font-bold text-blue-600">MeetSync</a>
            </div>




            <div class="relative flex items-center space-x-2 sm:space-x-4 lg:space-x-6">

                <!-- Notification Icon with Dynamic Badge -->
                <div class="relative ml-4">
                    <a th:href="@{/notifications}" class="relative focus:outline-none" aria-label="Notifications">
                        <!-- Bell Icon -->
                        <svg class="w-8 h-8 text-gray-600 hover:text-blue-600 transition" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <!-- Dynamic Badge -->
                        <span th:if="${unreadNotificationCount > 0}"
                            class="absolute -top-2 -right-2 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white bg-red-600 rounded-full"
                            th:text="${unreadNotificationCount}">0</span>
                    </a>
                </div>



                <!-- user Avatar -->
                <div class="relative">
                    <button id="userProfileBtn"
                        onclick="event.stopPropagation(); document.getElementById('userProfileDropdown').classList.toggle('hidden')"
                        class="flex items-center space-x-1 sm:space-x-2 text-gray-700 hover:text-blue-600 transition">
                        <!-- GOOGLE PHOTO: Show if exists -->
                        <img th:if="${currentUser.profilePic}" th:src="${currentUser.profilePic}"
                            class="w-8 h-8 sm:w-10 sm:h-10 lg:w-12 lg:h-12 rounded-full border border-blue-500 object-cover"
                            referrerpolicy="no-referrer" alt="">

                        <!-- FALLBACK ICON: Show if no photo (manual login) -->
                        <i th:unless="${currentUser.profilePic}"
                            class="far fa-user-circle text-xl sm:text-2xl text-blue-600"></i>
                        <div class="flex flex-col items-start">

                            <span class="hidden md:block font-medium text-sm lg:text-base"
                                th:text="${currentUser.name}">User Name</span>
                            <p class="text-sm text-gray-600 " th:text="${currentUser.email}">user@email.com</p>
                        </div>
                    </button>

                    <div id="userProfileDropdown" onclick="event.stopPropagation()"
                        class="hidden absolute right-0 mt-2 w-72 sm:w-80 bg-white rounded-lg shadow-xl border border-gray-200 z-50">

                        <div class="p-6 border-b border-gray-200">
                            <h3 class="text-xl font-bold text-gray-900" th:text="${currentUser.name}">User Name</h3>
                            <p class="text-sm text-gray-600 mt-1" th:text="${currentUser.email}">user@email.com</p>
                        </div>


                    </div>
                </div>
            </div>

        </div>
    </nav>


</body>

</html>
