<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetSync - Events</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/home_style.css}">
    <link rel="stylesheet" th:href="@{/css/events_style.css}">
</head>

<body class="bg-gray-50">

    <!-- Include Navbar -->
    <div th:replace="~{fragments/home_nav :: navbar}"></div>

    <div class="flex">
        <!-- Include Sidebar -->
        <div th:replace="~{fragments/home_sidebar :: sidebar}"></div>

        <!-- Main Events Content -->
        <main class="flex-1 ml-64 mt-16 p-8">
            <!-- Page Header -->
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-bold text-gray-900">Events</h1>
                <div class="flex items-center space-x-4">
                    <button
                        class="flex items-center space-x-2 px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                        <i class="far fa-calendar"></i>
                        <span>Calendar View</span>
                    </button>
                    <button
                        class="px-4 py-2 bg-white border-2 border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 transition">
                        <i class="fas fa-list"></i>
                        <span class="ml-2">List View</span>
                    </button>
                </div>
            </div>


            <!-- Filters Section -->
            <!--        <div th:replace="~{fragments/events/events_filters :: filters}"></div>-->

            <!-- Success/Error Messages -->
            <div th:if="${successMessage}"
                class="mb-6 bg-green-50 border border-green-200 text-green-800 px-6 py-4 rounded-lg flex items-center">
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                        clip-rule="evenodd" />
                </svg>
                <span th:text="${successMessage}">Event deleted successfully!</span>
            </div>

            <div th:if="${errorMessage}"
                class="mb-6 bg-red-50 border border-red-200 text-red-800 px-6 py-4 rounded-lg flex items-center">
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                        clip-rule="evenodd" />
                </svg>
                <span th:text="${errorMessage}">Failed to delete event</span>
            </div>

            <!-- Events Grid -->
            <div class="flex items-center justify-between mb-6">
                
                <a href="/event-create"
                    class="inline-flex items-center px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                    New Event
                </a>
            </div>
            <div th:replace="~{fragments/events/events_main :: events_grid}"></div>

            <!--        list all-->
            <!--        <div>-->
            <!--            <ul>-->
            <!--                <li th:each="event : ${events}">-->
            <!--                    <a th:href="@{/events/{id}(id=${event.id})}"-->
            <!--                       th:text="${event.title}"></a>-->
            <!--                    <span th:text="' (' + ${event.timezone} + ')'"></span>-->
            <!--                </li>-->
            <!--            </ul>-->
            <!--        </div>-->

        </main>
    </div>

    <!-- JavaScript -->
    <!--<script th:src="@{/js/home_calendar.js}"></script>-->
    <!--<script th:src="@{/js/events_script.js}"></script>-->

    <script>
        // Confirmation dialog for event deletion
        function confirmDelete(form) {
            // Get event title from data attribute
            const eventTitle = form.getAttribute('data-event-title');

            const message = `Are you sure you want to delete "${eventTitle}"?\n\n` +
                `This will:\n` +
                `• Remove all time slots\n` +
                `• Delete all participant responses\n` +
                `• This action cannot be undone!\n\n` +
                `Do you want to continue?`;

            return confirm(message);
        }
    </script>

</body>

</html>
