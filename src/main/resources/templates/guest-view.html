<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Join Event | MeetSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Drag-to-select styling */
        .slot-cell.selected {
            background-color: #3b82f6 !important; /* Tailwind blue-500 */
        }
        .slot-cell.selecting {
            background-color: #93c5fd !important; /* Tailwind blue-300 */
        }
        /* Scroller styling for the grid */
        .grid-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .grid-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<div class="max-w-7xl mx-auto p-4 md:p-10">
    <div class="mb-8 border-l-4 border-blue-600 pl-6">
        <h1 class="text-4xl font-black text-slate-800 tracking-tight" th:text="${event.title}">Team Sync</h1>
        <div class="flex items-center gap-4 mt-2 text-slate-500 font-medium">
            <span class="flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span th:text="${event.timezone}">UTC</span>
            </span>
            <span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs uppercase" th:text="${event.slotDuration + ' min slots'}">60 min</span>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col md:flex-row">

        <div class="flex-none w-24 bg-slate-50 border-r border-slate-200">
            <div class="h-20 border-b border-slate-200 flex items-center justify-center text-[10px] font-black text-slate-400 uppercase tracking-widest">
                Time
            </div>
            <div th:each="time : ${hours}"
                 class="h-16 border-b border-slate-100 flex items-center justify-center text-xs font-bold text-slate-500"
                 th:text="${#temporals.format(time, 'h a')}">
                9 AM
            </div>
        </div>

        <div class="flex-1 overflow-x-auto grid-scroll flex bg-slate-100">
            <div th:each="slot : ${event.slots}" class="flex-1 min-w-[140px] bg-white border-r border-slate-200 last:border-r-0">

                <div class="h-20 bg-slate-50 border-b border-slate-200 flex flex-col items-center justify-center gap-1">
                    <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest" th:text="${#temporals.format(slot.slotDate, 'EEE')}">MON</span>
                    <span class="text-lg font-bold text-slate-800" th:text="${#temporals.format(slot.slotDate, 'MMM d')}">JAN 5</span>
                </div>

                <div th:each="time : ${hours}"
                     class="slot-cell h-16 border-b border-slate-100 cursor-crosshair relative transition-all duration-75"
                     th:attr="data-date=${slot.slotDate}, data-time=${time}">
                </div>
            </div>
        </div>
    </div>

    <div class="mt-8 flex justify-end">
        <button id="saveSelection" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all active:scale-95">
            Submit My Availability
        </button>
    </div>
</div>

<script>
    // Selection Logic Variables
    let isMouseDown = false;
    const selectedSlots = new Set(); // Stores "date|time" strings
    const cells = document.querySelectorAll('.slot-cell');

    cells.forEach(cell => {
        // Start Drag
        cell.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            toggleSlot(cell);
            e.preventDefault(); // Prevent text selection
        });

        // Continue Drag
        cell.addEventListener('mouseenter', () => {
            if (isMouseDown) {
                toggleSlot(cell);
            }
        });
    });

    // Global Mouseup to stop dragging
    window.addEventListener('mouseup', () => {
        isMouseDown = false;
    });

    function toggleSlot(element) {
        const slotId = `${element.dataset.date}|${element.dataset.time}`;

        if (selectedSlots.has(slotId)) {
            selectedSlots.delete(slotId);
            element.classList.remove('selected');
        } else {
            selectedSlots.add(slotId);
            element.classList.add('selected');
        }
    }

    // Handle Submission
    document.getElementById('saveSelection').addEventListener('click', () => {
        const dataArray = Array.from(selectedSlots).map(s => {
            const [date, time] = s.split('|');
            return { date, time };
        });

        console.log("Submitting selection:", dataArray);

        if(dataArray.length === 0) {
            alert("Please select at least one time slot!");
            return;
        }

        // Future step: Fetch API call to send 'dataArray' to your participant controller
        alert(`You selected ${dataArray.length} slots. Ready for Heatmap integration!`);
    });
</script>

</body>
</html>
