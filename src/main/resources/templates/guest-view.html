<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Interactive Heatmap | MeetSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Personal Selection (Left Grid) */
        .personal-cell.selected { background-color: #3b82f6 !important; border: 1px solid #1d4ed8; }

        /* Heatmap Colors (Right Grid) */
        .heat-0 { background-color: #ffffff; }
        .heat-1 { background-color: #dcfce7; border: 1px solid #bbf7d0; }
        .heat-2 { background-color: #86efac; border: 1px solid #4ade80; } 
        .heat-3 { background-color: #22c55e; border: 1px solid #16a34a; } 

        .tooltip {
            visibility: hidden; position: absolute; z-index: 50;
            background: #1e293b; color: white; padding: 6px 10px;
            border-radius: 6px; font-size: 11px; pointer-events: none;
            white-space: pre-line;
        }
        .has-tooltip:hover .tooltip { visibility: visible; }
        
        /* Smooth scrolling for the viewports */
        .viewport-scroll {
            scroll-behavior: smooth;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .viewport-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<div id="loginSection" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
        <h2 class="text-2xl font-bold mb-4">Join Event</h2>
        <input type="text" id="guestName" class="w-full px-4 py-3 border rounded-xl mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your name">
        <button onclick="enterEvent()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">View Heatmap</button>
    </div>
</div>

<div id="mainContent" class="hidden max-w-[1600px] mx-auto p-6">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-black text-slate-800" th:text="${event.title}">Event Title</h1>
            <!-- <p class="text-slate-500" th:text="${event.description}">Event Description</p> -->
        </div>
        <div class="text-right">
            <p class="text-sm font-bold text-slate-500">Responding as: <span id="currentUserName" class="text-blue-600"></span></p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-blue-700 font-bold uppercase text-xs tracking-widest">1. Select Your Availability</h3>
                <div class="flex gap-2">
                    <button onclick="scrollGrid('left', 'personal')" class="p-2 hover:bg-slate-100 rounded-full border">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button onclick="scrollGrid('right', 'personal')" class="p-2 hover:bg-slate-100 rounded-full border">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex border rounded-xl overflow-hidden shadow-inner">
                <div class="w-20 bg-slate-50 border-r border-slate-200 flex-shrink-0">
                    <div class="h-12 border-b bg-slate-100/50"></div>
                    <div th:each="time : ${hours}" class="h-12 border-b flex items-center justify-center text-[10px] font-bold text-slate-400" th:text="${#temporals.format(time, 'h a')}"></div>
                </div>
                <div id="personal-viewport" class="flex-1 overflow-x-auto bg-white viewport-scroll">
                    <div class="flex">
                        <!-- Create one column for each date -->
                        <div th:each="date : ${dates}" class="flex-shrink-0 min-w-[100px] border-r border-slate-100">
                            <!-- Date header -->
                            <div class="h-12 border-b bg-slate-50 flex flex-col items-center justify-center text-[10px] font-bold text-slate-600">
                                <span th:text="${#temporals.format(date, 'EEE')}"></span>
                                <span th:text="${#temporals.format(date, 'MMM d')}"></span>
                            </div>
                            
                            <!-- Time slots for this date -->
                            <div th:each="time : ${hours}" class="time-slot-container h-12 border-b border-slate-50 relative">
                                <th:block th:with="slotKey=${date.toString() + '_' + time.toString()}, slot=${slotMap.get(slotKey)}">
                                    <div th:if="${slot != null}"
                                         class="personal-cell clickable-slot w-full h-full cursor-pointer hover:bg-blue-50 transition-colors" 
                                         th:attr="data-slot-id=${slot.id}"
                                         onclick="handleSlotClick(this)"></div>
                                    <div th:if="${slot == null}"
                                         class="w-full h-full bg-gray-100 opacity-50"></div>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <form id="availabilityForm" th:action="@{/event/participant/submit}" method="POST">
    <input type="hidden" name="eventId" th:value="${event.id}">
    <input type="hidden" id="formGuestName" name="participantName">
    <input type="hidden" id="selectedSlotsInput" name="slotIds">

    <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
        <button type="button" onclick="handleFormSubmit()" class="w-full mt-6 bg-blue-600 ...">
            Save My Availability
        </button>
    </div>
</form>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-green-700 font-bold uppercase text-xs tracking-widest">2. Group Availability Heatmap</h3>
                <div class="flex gap-2">
                    <button onclick="scrollGrid('left', 'heatmap')" class="p-2 hover:bg-slate-100 rounded-full border">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button onclick="scrollGrid('right', 'heatmap')" class="p-2 hover:bg-slate-100 rounded-full border">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex border rounded-xl overflow-hidden shadow-inner">
                <div class="w-20 bg-slate-50 border-r border-slate-200 flex-shrink-0">
                    <div class="h-12 border-b bg-slate-100/50"></div>
                    <div th:each="time : ${hours}" class="h-12 border-b flex items-center justify-center text-[10px] font-bold text-slate-400" th:text="${#temporals.format(time, 'h a')}"></div>
                </div>
                <div id="heatmap-viewport" class="flex-1 overflow-x-auto bg-white viewport-scroll">
                    <div class="flex">
                        <!--one column for each date -->
                        <div th:each="date : ${dates}" class="flex-shrink-0 min-w-[100px] border-r border-slate-100">
                            <!-- Date header -->
                            <div class="h-12 border-b bg-slate-50 flex flex-col items-center justify-center text-[10px] font-bold text-slate-600">
                                <span th:text="${#temporals.format(date, 'EEE')}"></span>
                                <span th:text="${#temporals.format(date, 'MMM d')}"></span>
                            </div>
                            
                            <!-- Time slots for this date -->
                            <div th:each="time : ${hours}" class="time-slot-container h-12 border-b border-slate-50 relative">
                                <th:block th:with="slotKey=${date.toString() + '_' + time.toString()}, slot=${slotMap.get(slotKey)}">
                                    <div th:if="${slot != null}"
                                         class="heat-cell has-tooltip w-full h-full" 
                                         th:attr="data-slot-id=${slot.id}">
                                        <div class="tooltip shadow-xl">No votes</div>
                                    </div>
                                    <div th:if="${slot == null}"
                                         class="w-full h-full bg-gray-100 opacity-50"></div>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 flex items-center justify-center gap-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                <span>Less Available</span>
                <div class="flex gap-1">
                    <div class="w-4 h-4 rounded-sm heat-0 border"></div>
                    <div class="w-4 h-4 rounded-sm heat-1"></div>
                    <div class="w-4 h-4 rounded-sm heat-2"></div>
                    <div class="w-4 h-4 rounded-sm heat-3"></div>
                </div>
                <span>More Available</span>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">

    const globalData = /*[[${heatmapData}]]*/ {}; 
    const eventId = /*[[${event.id}]]*/ 0;
    
    // 2. Variables
    let currentUser = "";
    let isMouseDown = false;
    let mySelections = new Set();

    // 3. Functions - Explicitly attached to window to prevent ReferenceErrors
    window.enterEvent = function() {
        const input = document.getElementById('guestName');
        if (!input.value.trim()) {
            alert("Please enter a name");
            return;
        }
        currentUser = input.value.trim();
        document.getElementById('currentUserName').innerText = currentUser;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        refreshHeatmap();
    };

    window.scrollGrid = function(direction, type) {
        const viewport = document.getElementById(`${type}-viewport`);
        const scrollAmount = 300; 
        viewport.scrollLeft += (direction === 'left' ? -scrollAmount : scrollAmount);
    };

    // --- SELECTION LOGIC ---
    function togglePersonalSlot(cell) {
        const slotId = cell.dataset.slotId;
        if (mySelections.has(slotId)) {
            mySelections.delete(slotId);
            cell.classList.remove('selected');
        } else {
            mySelections.add(slotId);
            cell.classList.add('selected');
        }
        console.log(`Toggled slot ${slotId}. Current selections:`, Array.from(mySelections));
    }

   
    window.handleSlotClick = function(element) {
        const slotId = element.getAttribute('data-slot-id');
        console.log(`Direct click on slot ${slotId}`);
        if (slotId) {
            togglePersonalSlot(element);
        }
    };

    window.handleFormSubmit = function() {
    if (mySelections.size === 0) {
        alert("Please select at least one slot.");
        return;
    }

    document.getElementById('formGuestName').value = currentUser;

    document.getElementById('selectedSlotsInput').value = Array.from(mySelections).join(',');

    document.getElementById('availabilityForm').submit();
};

    // --- HEATMAP RENDERING ---
    function refreshHeatmap() {
        document.querySelectorAll('.heat-cell').forEach(cell => {
            const slotId = cell.dataset.slotId;
            const participants = globalData[slotId] || [];
            const count = participants.length;

            cell.classList.remove('heat-0', 'heat-1', 'heat-2', 'heat-3');
            if (count >= 3) cell.classList.add('heat-3');
            else if (count === 2) cell.classList.add('heat-2');
            else if (count === 1) cell.classList.add('heat-1');
            else cell.classList.add('heat-0');

            const tooltip = cell.querySelector('.tooltip');
            tooltip.innerText = count > 0 
                ? `${count} available:\n${participants.join('\n')}` 
                : "No one available";
        });
    }

    // --- SUBMISSION ---
    window.submitAvailability = function() {
        if (mySelections.size === 0) {
            alert("Please select at least one slot.");
            return;
        }

        const params = new URLSearchParams();
        params.append('participantName', currentUser);
        mySelections.forEach(id => params.append('slotIds', id));

        fetch('/event/participant/submit', {
            method: 'POST',
            body: params
        })
        .then(response => {
            if(response.ok) window.location.reload();
            else alert("Submission failed.");
        })
        .catch(err => {
            console.error(err);
            alert("Error saving availability.");
        });
    };

    document.addEventListener('DOMContentLoaded', () => {
        console.log("DOM loaded, attaching event listeners...");
        
       
        const personalCells = document.querySelectorAll('.personal-cell');
        const clickableSlots = document.querySelectorAll('.clickable-slot');
        console.log(`Found ${personalCells.length} personal cells`);
        console.log(`Found ${clickableSlots.length} clickable slots`);
        
        
        clickableSlots.forEach((cell, index) => {
            const slotId = cell.getAttribute('data-slot-id');
            console.log(`Clickable slot ${index}: slot-id = ${slotId}`);
            
            if (slotId) {
               
                cell.addEventListener('click', (e) => {
                    console.log(`Event listener click on slot ${slotId}`);
                    togglePersonalSlot(cell);
                    e.stopPropagation();
                });
                
                cell.addEventListener('mousedown', (e) => {
                    console.log(`Mousedown on slot ${slotId}`);
                    isMouseDown = true;
                    togglePersonalSlot(cell);
                    e.preventDefault();
                });
                
                cell.addEventListener('mouseenter', () => {
                    if (isMouseDown) {
                        console.log(`Dragged into slot ${slotId}`);
                        togglePersonalSlot(cell);
                    }
                });
            } else {
                console.warn(`Clickable slot ${index} has no slot-id attribute`);
            }
        });
        
        window.addEventListener('mouseup', () => isMouseDown = false);
        
        console.log("Heatmap data:", globalData);
        
        setTimeout(() => {
            console.log("Testing slot detection...");
            const testSlots = document.querySelectorAll('[data-slot-id]');
            console.log(`Total slots with data-slot-id: ${testSlots.length}`);
            testSlots.forEach((slot, i) => {
                console.log(`Slot ${i}: ID=${slot.getAttribute('data-slot-id')}, classes=${slot.className}`);
            });
        }, 1000);
    });

</script>
</body>
</html>
