<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Interactive Heatmap | MeetSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Personal Selection (Left Grid) */
        .personal-cell.selected { background-color: #3b82f6 !important; border: 1px solid #1d4ed8; }

        /* Heatmap Colors (Right Grid) */
        .heat-0 { background-color: #ffffff; }
        .heat-1 { background-color: #dcfce7; border: 1px solid #bbf7d0; }
        .heat-2 { background-color: #86efac; border: 1px solid #4ade80; } 
        .heat-3 { background-color: #22c55e; border: 1px solid #16a34a; } 

        /* Preview  */
        .heat-cell {
            transition: all 0.2s ease-in-out;
        }

        .tooltip {
            visibility: hidden; position: absolute; z-index: 50;
            background: #1e293b; color: white; padding: 6px 10px;
            border-radius: 6px; font-size: 11px; pointer-events: none;
            white-space: pre-line;
        }
        .has-tooltip:hover .tooltip { visibility: visible; }
        
        /* Smooth scrolling for the viewports */
        .viewport-scroll {
            scroll-behavior: smooth;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .viewport-scroll::-webkit-scrollbar { display: none; }

        /* Animation for preview */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        #previewIndicator {
            animation: slideInRight 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<div id="loginSection" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
        <h2 class="text-2xl font-bold mb-4">Join Event</h2>
        <h3 class="text-lg font-semibold mb-4" th:text="${event.title}">Event Name</h3>
        <input type="text" id="guestName" class="w-full px-4 py-3 border rounded-xl mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your name">
        <button onclick="enterEvent()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">View Heatmap</button>
    </div>
</div>

<div id="mainContent" class="hidden max-w-[1600px] mx-auto p-6">
    <!-- Success Message Section -->
    <div th:if="${successMessage}" class="mb-6 bg-green-100 border-l-4 border-green-500 p-6 rounded-xl shadow-md">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-green-700 font-semibold" th:text="${successMessage}">Success message</p>
                <p class="text-green-600 text-sm mt-1">Thank you, <span th:text="${participantName}" class="font-medium">participant</span>! Your selections have been added to the heatmap below.</p>
            </div>
        </div>
    </div>

    <!-- Error Message Section -->
    <div th:if="${errorMessage}" class="mb-6 bg-red-100 border-l-4 border-red-500 p-6 rounded-xl shadow-md">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-red-700 font-semibold" th:text="${errorMessage}">Error message</p>
            </div>
        </div>
    </div>

    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-black text-slate-800" th:text="${event.title}">Event Title</h1>
            <!-- <p class="text-slate-500" th:text="${event.description}">Event Description</p> -->
        </div>
        <div class="text-right">
            <p class="text-sm font-bold text-slate-500">Responding as: <span id="currentUserName" class="text-blue-600"></span></p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Left Panel: Personal Selection (hidden after submission) -->
        <div th:if="${successMessage == null}" class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-blue-700 font-bold uppercase text-xs tracking-widest">1. Select Your Availability</h3>
                <div class="flex gap-2">
                    <button onclick="scrollGrid('left', 'personal')" class="p-2 hover:bg-slate-100 rounded-full border">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button onclick="scrollGrid('right', 'personal')" class="p-2 hover:bg-slate-100 rounded-full border">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex border rounded-xl overflow-hidden shadow-inner">
                <div class="w-20 bg-slate-50 border-r border-slate-200 flex-shrink-0">
                    <div class="h-12 border-b bg-slate-100/50"></div>
                    <div th:each="time : ${hours}" class="h-12 border-b flex items-center justify-center text-[10px] font-bold text-slate-400" th:text="${#temporals.format(time, 'h a')}"></div>
                </div>
                <div id="personal-viewport" class="flex-1 overflow-x-auto bg-white viewport-scroll">
                    <div class="flex">
                        <!-- Create one column for each date -->
                        <div th:each="date : ${dates}" class="flex-shrink-0 min-w-[100px] border-r border-slate-100">
                            <!-- Date header -->
                            <div class="h-12 border-b bg-slate-50 flex flex-col items-center justify-center text-[10px] font-bold text-slate-600">
                                <span th:text="${#temporals.format(date, 'EEE')}"></span>
                                <span th:text="${#temporals.format(date, 'MMM d')}"></span>
                            </div>
                            
                            <!-- Time slots for this date -->
                            <div th:each="time : ${hours}" class="time-slot-container h-12 border-b border-slate-50 relative">
                                <th:block th:with="slotKey=${date.toString() + '_' + time.toString()}, slot=${slotMap.get(slotKey)}">
                                    <div th:if="${slot != null}"
                                         class="personal-cell clickable-slot w-full h-full cursor-pointer hover:bg-blue-50 transition-colors" 
                                         th:attr="data-slot-id=${slot.id}"
                                         onclick="handleSlotClick(this)"></div>
                                    <div th:if="${slot == null}"
                                         class="w-full h-full bg-gray-100 opacity-50"></div>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <form id="availabilityForm" th:action="@{/event/participant/submit}" method="POST">
    <input type="hidden" name="eventId" th:value="${event.id}">
    <input type="hidden" id="formGuestName" name="participantName">
    <input type="hidden" id="selectedSlotsInput" name="slotIds">

    <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
        <div id="selectionSummary" class="mb-4 text-sm text-slate-600 hidden">
            <span id="selectionCount">0</span> time slots selected
        </div>
        <button type="button" id="submitButton" onclick="handleFormSubmit()" 
                class="w-full bg-gray-400 text-white font-bold py-3 rounded-xl transition-all duration-300 cursor-not-allowed" 
                disabled>
            Select at least one slot to continue
        </button>
    </div>
</form>
        </div>

        <!-- Right Panel: Heatmap (full width after submission) -->
        <div th:class="${successMessage != null} ? 'col-span-full bg-white p-6 rounded-2xl shadow-lg border border-slate-200' : 'bg-white p-6 rounded-2xl shadow-lg border border-slate-200'">
            <div class="flex justify-between items-center mb-4">
                <h3 th:class="${successMessage != null} ? 'text-green-700 font-bold uppercase text-xs tracking-widest' : 'text-green-700 font-bold uppercase text-xs tracking-widest'" 
                    th:text="${successMessage != null} ? 'Group Availability Heatmap - Your Response Recorded!' : '2. Group Availability Heatmap'"></h3>
                <div class="flex gap-2">
                    <button onclick="scrollGrid('left', 'heatmap')" class="p-2 hover:bg-slate-100 rounded-full border">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button onclick="scrollGrid('right', 'heatmap')" class="p-2 hover:bg-slate-100 rounded-full border">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex border rounded-xl overflow-hidden shadow-inner">
                <div class="w-20 bg-slate-50 border-r border-slate-200 flex-shrink-0">
                    <div class="h-12 border-b bg-slate-100/50"></div>
                    <div th:each="time : ${hours}" class="h-12 border-b flex items-center justify-center text-[10px] font-bold text-slate-400" th:text="${#temporals.format(time, 'h a')}"></div>
                </div>
                <div id="heatmap-viewport" class="flex-1 overflow-x-auto bg-white viewport-scroll">
                    <div class="flex">
                        <!--one column for each date -->
                        <div th:each="date : ${dates}" class="flex-shrink-0 min-w-[100px] border-r border-slate-100">
                            <!-- Date header -->
                            <div class="h-12 border-b bg-slate-50 flex flex-col items-center justify-center text-[10px] font-bold text-slate-600">
                                <span th:text="${#temporals.format(date, 'EEE')}"></span>
                                <span th:text="${#temporals.format(date, 'MMM d')}"></span>
                            </div>
                            
                            <!-- Time slots for this date -->
                            <div th:each="time : ${hours}" class="time-slot-container h-12 border-b border-slate-50 relative">
                                <th:block th:with="slotKey=${date.toString() + '_' + time.toString()}, slot=${slotMap.get(slotKey)}">
                                    <div th:if="${slot != null}"
                                         class="heat-cell has-tooltip w-full h-full" 
                                         th:attr="data-slot-id=${slot.id}">
                                        <div class="tooltip shadow-xl">No votes</div>
                                    </div>
                                    <div th:if="${slot == null}"
                                         class="w-full h-full bg-gray-100 opacity-50"></div>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 flex items-center justify-center gap-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                <span>Less Available</span>
                <div class="flex gap-1">
                    <div class="w-4 h-4 rounded-sm heat-0 border"></div>
                    <div class="w-4 h-4 rounded-sm heat-1"></div>
                    <div class="w-4 h-4 rounded-sm heat-2"></div>
                    <div class="w-4 h-4 rounded-sm heat-3"></div>
                </div>
                <span>More Available</span>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">

    const globalData = /*[[${heatmapData}]]*/ {}; 
    const eventId = /*[[${event.id}]]*/ 0;
    
    // Post-submission data from flash attributes
    const successMessage = /*[[${successMessage}]]*/ null;
    const submittedParticipantName = /*[[${participantName}]]*/ null;
    const submittedSlots = /*[[${submittedSlots}]]*/ null;
    
    // 2. Variables
    let currentUser = "";
    let isMouseDown = false;
    let mySelections = new Set();
    
    // Preview mode variables
    let previewData = {};
    let isPreviewMode = false;

    // 3. Functions - Explicitly attached to window to prevent ReferenceErrors
    window.enterEvent = function() {
        const input = document.getElementById('guestName');
        const enteredName = input.value.trim();
        
        if (!enteredName) {
            alert("Please enter a name");
            return;
        }
        
        // duplicate name check
        const existingNames = new Set();
        Object.values(globalData).forEach(participants => {
            participants.forEach(name => existingNames.add(name));
        });
        
        if (existingNames.has(enteredName)) {
            alert(`The name "${enteredName}" has already been used for this event. Please choose a different name.`);
            input.focus();
            return;
        }
        
        currentUser = enteredName;
        document.getElementById('currentUserName').innerText = currentUser;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        
        // Initialize the submit button state
        updateSubmitButton();
        
        refreshHeatmap();
    };

    window.scrollGrid = function(direction, type) {
        const viewport = document.getElementById(`${type}-viewport`);
        const scrollAmount = 300; 
        viewport.scrollLeft += (direction === 'left' ? -scrollAmount : scrollAmount);
    };

    // --- SELECTION LOGIC ---
    function togglePersonalSlot(cell) {
        const slotId = cell.dataset.slotId;
        if (mySelections.has(slotId)) {
            mySelections.delete(slotId);
            cell.classList.remove('selected');
        } else {
            mySelections.add(slotId);
            cell.classList.add('selected');
        }
        console.log(`Toggled slot ${slotId}. Current selections:`, Array.from(mySelections));
        
        // Update live preview
        updateLivePreview();
    }
    
    // --- LIVE PREVIEW MODE ---
    function updateLivePreview() {
        if (!currentUser) return;
        
        // Update submit button state
        updateSubmitButton();
        
        // Enable preview mode
        isPreviewMode = true;
        
        // Calculate preview data by adding current user's selections to global data
        previewData = {};
        Object.keys(globalData).forEach(slotId => {
            previewData[slotId] = [...globalData[slotId]]; // Copy existing participants
        });
        
        // Add current user's selections to preview
        mySelections.forEach(slotId => {
            if (!previewData[slotId]) {
                previewData[slotId] = [];
            }
            if (!previewData[slotId].includes(currentUser)) {
                previewData[slotId].push(currentUser);
            }
        });
        
        // Remove current user from slots they deselected
        Object.keys(previewData).forEach(slotId => {
            if (!mySelections.has(slotId)) {
                previewData[slotId] = previewData[slotId].filter(name => name !== currentUser);
            }
        });
        
        // Refresh heatmap with preview data
        refreshHeatmapWithPreview();
        
        // Show preview indicator if user has selections
        if (mySelections.size > 0) {
            showPreviewIndicator();
        } else {
            hidePreviewIndicator();
        }
    }
    
    function updateSubmitButton() {
        const submitButton = document.getElementById('submitButton');
        if (!submitButton) return; // Button doesn't exist in post-submission view
        
        const selectionSummary = document.getElementById('selectionSummary');
        const selectionCount = document.getElementById('selectionCount');
        
        if (mySelections.size > 0) {
            submitButton.disabled = false;
            submitButton.className = 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all duration-300 transform hover:scale-[1.02]';
            submitButton.textContent = `Submit My Availability (${mySelections.size} slots)`;
            
            if (selectionSummary) selectionSummary.classList.remove('hidden');
            if (selectionCount) selectionCount.textContent = mySelections.size;
        } else {
            submitButton.disabled = true;
            submitButton.className = 'w-full bg-gray-400 text-white font-bold py-3 rounded-xl transition-all duration-300 cursor-not-allowed';
            submitButton.textContent = 'Select at least one slot to continue';
            
            if (selectionSummary) selectionSummary.classList.add('hidden');
        }
    }
    
    function showPreviewIndicator() {
        let indicator = document.getElementById('previewIndicator');
        if (!indicator) {
            indicator = document.createElement('div');
            indicator.id = 'previewIndicator';
            indicator.className = 'fixed top-4 right-4 z-40 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2';
            indicator.innerHTML = `
                <div class="w-2 h-2 bg-blue-300 rounded-full animate-pulse"></div>
                Live Preview Mode
                <button onclick="clearPreview()" class="ml-2 bg-blue-500 hover:bg-blue-400 px-2 py-1 rounded text-xs">
                    Clear
                </button>
            `;
            document.body.appendChild(indicator);
        }
    }
    
    function hidePreviewIndicator() {
        const indicator = document.getElementById('previewIndicator');
        if (indicator) {
            indicator.remove();
        }
    }
    
    window.clearPreview = function() {
        mySelections.clear();
        isPreviewMode = false;
        
        // Remove selected styling from all personal cells
        document.querySelectorAll('.personal-cell.selected').forEach(cell => {
            cell.classList.remove('selected');
        });
        
        // Update submit button
        updateSubmitButton();
        
        // Reset to original data
        refreshHeatmap();
        hidePreviewIndicator();
    };
    
    function refreshHeatmapWithPreview() {
        const dataToUse = isPreviewMode ? previewData : globalData;
        
        document.querySelectorAll('.heat-cell').forEach(cell => {
            const slotId = cell.dataset.slotId;
            const participants = dataToUse[slotId] || [];
            const count = participants.length;

            cell.classList.remove('heat-0', 'heat-1', 'heat-2', 'heat-3');
            if (count >= 3) cell.classList.add('heat-3');
            else if (count === 2) cell.classList.add('heat-2');
            else if (count === 1) cell.classList.add('heat-1');
            else cell.classList.add('heat-0');

            const tooltip = cell.querySelector('.tooltip');
            
            if (isPreviewMode) {
                // Show preview tooltip with different styling
                const originalParticipants = globalData[slotId] || [];
                const isUserSelected = mySelections.has(slotId);
                const previewText = count > 0 
                    ? `${count} available:\n${participants.join('\n')}` 
                    : "No one available";
                
                if (isUserSelected && !originalParticipants.includes(currentUser)) {
                    tooltip.innerHTML = `<strong style="color: #60a5fa;">PREVIEW</strong><br>${previewText}`;
                } else {
                    tooltip.innerText = previewText;
                }
            } else {
                tooltip.innerText = count > 0 
                    ? `${count} available:\n${participants.join('\n')}` 
                    : "No one available";
            }
        });
    }

   
    window.handleSlotClick = function(element) {
        const slotId = element.getAttribute('data-slot-id');
        console.log(`Direct click on slot ${slotId}`);
        if (slotId) {
            togglePersonalSlot(element);
        }
    };

    window.handleFormSubmit = function() {
    if (mySelections.size === 0) {
        alert("Please select at least one slot.");
        return;
    }

    document.getElementById('formGuestName').value = currentUser;

    document.getElementById('selectedSlotsInput').value = Array.from(mySelections).join(',');

    document.getElementById('availabilityForm').submit();
};

    // --- HEATMAP RENDERING ---
    function refreshHeatmap() {
        refreshHeatmapWithPreview();
    }

    // --- SUBMISSION ---
    window.submitAvailability = function() {
        if (mySelections.size === 0) {
            alert("Please select at least one slot.");
            return;
        }

        const params = new URLSearchParams();
        params.append('participantName', currentUser);
        mySelections.forEach(id => params.append('slotIds', id));

        fetch('/event/participant/submit', {
            method: 'POST',
            body: params
        })
        .then(response => {
            if(response.ok) window.location.reload();
            else alert("Submission failed.");
        })
        .catch(err => {
            console.error(err);
            alert("Error saving availability.");
        });
    };

    document.addEventListener('DOMContentLoaded', () => {
        console.log("DOM loaded, attaching event listeners...");
        
        // Check if this is a post-submission page load
        const urlParams = new URLSearchParams(window.location.search);
        const isPostSubmission = urlParams.get('submitted') === 'true' || successMessage !== null;
        
        if ((isPostSubmission && submittedParticipantName) || successMessage !== null) {
            console.log("Post-submission page detected for:", submittedParticipantName || 'unknown participant');
            
            // Auto-fill the participant name and enter the event
            const participantName = submittedParticipantName || 'Guest';
            document.getElementById('guestName').value = participantName;
            currentUser = participantName;
            
            // Skip the login section and show main content directly
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('currentUserName').textContent = currentUser;
            
            // Scroll to success message if it exists
            setTimeout(() => {
                const successDiv = document.querySelector('.bg-green-100');
                if (successDiv) {
                    successDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                
                // Refresh heatmap to show current data
                refreshHeatmap();
                
                // Clean up the URL by removing the submitted parameter
                const url = new URL(window.location);
                url.searchParams.delete('submitted');
                window.history.replaceState({}, '', url.toString());
            }, 100);
            
            // Don't attach selection event listeners for post-submission view
            return;
        } else if (isPostSubmission) {
            console.log("Post-submission page detected but no participant name in flash attributes");
        }
        
        // Only attach selection event listeners if this is NOT a post-submission view
        const personalCells = document.querySelectorAll('.personal-cell');
        const clickableSlots = document.querySelectorAll('.clickable-slot');
        console.log(`Found ${personalCells.length} personal cells`);
        console.log(`Found ${clickableSlots.length} clickable slots`);
        
        
        clickableSlots.forEach((cell, index) => {
            const slotId = cell.getAttribute('data-slot-id');
            console.log(`Clickable slot ${index}: slot-id = ${slotId}`);
            
            if (slotId) {
               
                cell.addEventListener('click', (e) => {
                    console.log(`Event listener click on slot ${slotId}`);
                    togglePersonalSlot(cell);
                    e.stopPropagation();
                });
                
                cell.addEventListener('mousedown', (e) => {
                    console.log(`Mousedown on slot ${slotId}`);
                    isMouseDown = true;
                    togglePersonalSlot(cell);
                    e.preventDefault();
                });
                
                cell.addEventListener('mouseenter', () => {
                    if (isMouseDown) {
                        console.log(`Dragged into slot ${slotId}`);
                        togglePersonalSlot(cell);
                    }
                });
            } else {
                console.warn(`Clickable slot ${index} has no slot-id attribute`);
            }
        });
        
        window.addEventListener('mouseup', () => isMouseDown = false);
        
        console.log("Heatmap data:", globalData);
        
        setTimeout(() => {
            console.log("Testing slot detection...");
            const testSlots = document.querySelectorAll('[data-slot-id]');
            console.log(`Total slots with data-slot-id: ${testSlots.length}`);
            testSlots.forEach((slot, i) => {
                console.log(`Slot ${i}: ID=${slot.getAttribute('data-slot-id')}, classes=${slot.className}`);
            });
        }, 1000);
    });

</script>
</body>
</html>
