<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MeetSync | Interactive Heatmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .heat-0 { background-color: #ffffff; }
        .heat-1 { background-color: #dcfce7; }
        .heat-2 { background-color: #86efac; }
        .heat-3 { background-color: #22c55e; }

        .slot-cell.selected { background-color: #3b82f6 !important; border: 1px solid #2563eb; }

        /* Tooltip styling */
        .tooltip {
            visibility: hidden;
            position: absolute;
            z-index: 50;
            background: #1e293b;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            white-space: pre-line;
        }
        .has-tooltip:hover .tooltip { visibility: visible; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<div id="loginSection" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-4">Who are you?</h2>
        <input type="text" id="guestName" class="w-full px-4 py-3 border rounded-xl mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your name">
        <button onclick="enterEvent()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">Enter Event</button>
    </div>
</div>

<div id="mainContent" class="hidden max-w-[1600px] mx-auto p-6">
    <div class="mb-6">
        <h1 class="text-3xl font-black text-slate-800" th:text="${event.title}">Event</h1>
        <p class="text-slate-500">Logged in as: <span id="currentUserName" class="text-blue-600 font-bold"></span></p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">

        <div class="bg-white p-4 rounded-2xl shadow-lg border border-slate-200">
            <h3 class="text-lg font-bold mb-4 text-center text-blue-700 uppercase tracking-wider">Your Availability</h3>
            <div class="flex border rounded-xl overflow-hidden bg-slate-50">
                <div class="w-20 flex-none bg-slate-100 border-r border-slate-200">
                    <div class="h-12 border-b flex items-center justify-center text-[10px] font-bold text-slate-400">TIME</div>
                    <div th:each="time : ${hours}" class="h-12 border-b flex items-center justify-center text-[10px] font-medium text-slate-500" th:text="${#temporals.format(time, 'h a')}"></div>
                </div>
                <div class="flex-1 overflow-x-auto flex">
                    <div th:each="slot : ${event.slots}" class="flex-1 min-w-[80px] bg-white border-r last:border-0 border-slate-200">
                        <div class="h-12 border-b bg-slate-50 flex flex-col items-center justify-center text-[10px] font-bold">
                            <span th:text="${#temporals.format(slot.slotDate, 'EEE')}"></span>
                            <span th:text="${#temporals.format(slot.slotDate, 'd')}"></span>
                        </div>
                        <div th:each="time : ${hours}" class="personal-cell h-12 border-b border-slate-100 cursor-pointer hover:bg-blue-50 transition-all" th:attr="data-date=${slot.slotDate}, data-time=${time}"></div>
                    </div>
                </div>
            </div>
            <button onclick="submitAvailability()" class="w-full mt-4 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">Update My Slots</button>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-lg border border-slate-200">
            <h3 class="text-lg font-bold mb-4 text-center text-green-700 uppercase tracking-wider">Group Availability (Heatmap)</h3>
            <div class="flex border rounded-xl overflow-hidden bg-slate-50">
                <div class="w-20 flex-none bg-slate-100 border-r border-slate-200">
                    <div class="h-12 border-b flex items-center justify-center text-[10px] font-bold text-slate-400">TIME</div>
                    <div th:each="time : ${hours}" class="h-12 border-b flex items-center justify-center text-[10px] font-medium text-slate-500" th:text="${#temporals.format(time, 'h a')}"></div>
                </div>
                <div class="flex-1 overflow-x-auto flex">
                    <div th:each="slot : ${event.slots}" class="flex-1 min-w-[80px] bg-white border-r last:border-0 border-slate-200">
                        <div class="h-12 border-b bg-slate-50 flex flex-col items-center justify-center text-[10px] font-bold">
                            <span th:text="${#temporals.format(slot.slotDate, 'EEE')}"></span>
                            <span th:text="${#temporals.format(slot.slotDate, 'd')}"></span>
                        </div>
                        <div th:each="time : ${hours}" class="heat-cell has-tooltip h-12 border-b border-slate-100 relative" th:attr="data-date=${slot.slotDate}, data-time=${time}">
                            <div class="tooltip shadow-lg">No votes yet</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = "";
    let isMouseDown = false;
    let mySelections = new Set();

    // MOCK DATA: { "date|time": ["User1", "User2"] }
    let globalData = {
        "2026-01-05|09:00": ["Alice", "Bob"],
        "2026-01-05|10:00": ["Alice", "Bob", "Charlie"],
        "2026-01-06|11:00": ["Charlie"]
    };

    function enterEvent() {
        const nameInput = document.getElementById('guestName');
        if (!nameInput.value.trim()) return;
        currentUser = nameInput.value.trim();
        document.getElementById('currentUserName').innerText = currentUser;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        refreshHeatmap();
    }

    // SELECTION LOGIC (Left Grid)
    document.querySelectorAll('.personal-cell').forEach(cell => {
        cell.addEventListener('mousedown', (e) => { isMouseDown = true; toggleCell(cell); e.preventDefault(); });
        cell.addEventListener('mouseenter', () => { if (isMouseDown) toggleCell(cell); });
    });
    window.addEventListener('mouseup', () => isMouseDown = false);

    function toggleCell(cell) {
        const id = `${cell.dataset.date}|${cell.dataset.time}`;
        if (mySelections.has(id)) {
            mySelections.delete(id);
            cell.classList.remove('selected');
        } else {
            mySelections.add(id);
            cell.classList.add('selected');
        }
    }

    function submitAvailability() {
        // 1. Remove currentUser from all slots in globalData first
        for (let key in globalData) {
            globalData[key] = globalData[key].filter(u => u !== currentUser);
        }

        // 2. Add current selections to globalData
        mySelections.forEach(id => {
            if (!globalData[id]) globalData[id] = [];
            if (!globalData[id].includes(currentUser)) globalData[id].push(currentUser);
        });

        refreshHeatmap();
        alert("Heatmap updated with your selection!");
    }

    function refreshHeatmap() {
        document.querySelectorAll('.heat-cell').forEach(cell => {
            const id = `${cell.dataset.date}|${cell.dataset.time}`;
            const users = globalData[id] || [];
            const count = users.length;

            // Set Heatmap Color
            cell.classList.remove('heat-0', 'heat-1', 'heat-2', 'heat-3');
            if (count >= 3) cell.classList.add('heat-3');
            else if (count === 2) cell.classList.add('heat-2');
            else if (count === 1) cell.classList.add('heat-1');
            else cell.classList.add('heat-0');

            // Set Tooltip Text
            const tooltip = cell.querySelector('.tooltip');
            tooltip.innerText = count > 0 ? `${count} available:\n${users.join('\n')}` : "No one available";
        });
    }
</script>
</body>
</html>
