<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Calendar Component Fragment -->
<div th:fragment="calendar" class="bg-white rounded-lg shadow-lg p-6">
    <div class="mb-4">
        <h3 class="text-lg font-bold text-gray-800 mb-4">Select Dates</h3>
        
        <!-- Month Navigation -->
        <div class="flex items-center justify-between mb-4">
            <button type="button" onclick="previousMonth()" class="p-2 hover:bg-gray-100 rounded-lg transition">
                <i class="fas fa-chevron-left text-gray-600"></i>
            </button>
            <span id="currentMonth" class="font-semibold text-gray-800">September 2021</span>
            <button type="button" onclick="nextMonth()" class="p-2 hover:bg-gray-100 rounded-lg transition">
                <i class="fas fa-chevron-right text-gray-600"></i>
            </button>
        </div>

        <!-- Day Headers -->
        <div class="grid grid-cols-7 gap-1 mb-2">
            <div class="text-center text-xs font-semibold text-gray-500 py-2">SUN</div>
            <div class="text-center text-xs font-semibold text-gray-500 py-2">MON</div>
            <div class="text-center text-xs font-semibold text-gray-500 py-2">TUE</div>
            <div class="text-center text-xs font-semibold text-gray-500 py-2">WED</div>
            <div class="text-center text-xs font-semibold text-gray-500 py-2">THU</div>
            <div class="text-center text-xs font-semibold text-gray-500 py-2">FRI</div>
            <div class="text-center text-xs font-semibold text-gray-500 py-2">SAT</div>
        </div>

        <!-- Calendar Grid -->
        <div id="calendarGrid" class="grid grid-cols-7 gap-1">
            <!-- Days will be populated by JavaScript -->
        </div>
    </div>

    <!-- Selected Dates Display -->
    <div id="selectedDatesContainer" class="mt-4 hidden">
        <h4 class="text-sm font-semibold text-gray-700 mb-2">Selected Override Dates:</h4>
        <div id="selectedDatesList" class="space-y-1">
            <!-- Selected dates will be displayed here -->
        </div>
    </div>
</div>

<!-- Time Range Picker Fragment -->
<div th:fragment="timeRangePicker(label, namePrefix)" class="space-y-2">
    <label class="block text-sm font-semibold text-gray-700" th:text="${label}">Time Range</label>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="text-xs text-gray-600 mb-1 block">Not Earlier Than</label>
            <input type="time" 
                   th:name="${namePrefix + 'StartTime'}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                   value="09:00">
        </div>
        <div>
            <label class="text-xs text-gray-600 mb-1 block">Not Later Than</label>
            <input type="time" 
                   th:name="${namePrefix + 'EndTime'}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                   value="17:00">
        </div>
    </div>
</div>

<!-- Location Options Fragment -->
<div th:fragment="locationOptions" class="space-y-3">
    <label class="block text-sm font-semibold text-gray-700 mb-3">
        <i class="fas fa-map-marker-alt text-blue-600 mr-2"></i>
        Location
    </label>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <label class="flex flex-col items-center justify-center p-4 border-2 border-gray-300 rounded-lg cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
            <input type="radio" name="locationType" value="ZOOM" class="sr-only peer">
            <i class="fas fa-video text-2xl text-gray-400 peer-checked:text-blue-600 mb-2"></i>
            <span class="text-sm font-medium text-gray-700 peer-checked:text-blue-600">Zoom</span>
        </label>
        
        <label class="flex flex-col items-center justify-center p-4 border-2 border-gray-300 rounded-lg cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
            <input type="radio" name="locationType" value="PHONE" class="sr-only peer">
            <i class="fas fa-phone text-2xl text-gray-400 peer-checked:text-blue-600 mb-2"></i>
            <span class="text-sm font-medium text-gray-700 peer-checked:text-blue-600">Phone call</span>
        </label>
        
        <label class="flex flex-col items-center justify-center p-4 border-2 border-gray-300 rounded-lg cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
            <input type="radio" name="locationType" value="IN_PERSON" class="sr-only peer">
            <i class="fas fa-map-marker-alt text-2xl text-gray-400 peer-checked:text-blue-600 mb-2"></i>
            <span class="text-sm font-medium text-gray-700 peer-checked:text-blue-600">In-person</span>
        </label>
        
        <label class="flex flex-col items-center justify-center p-4 border-2 border-gray-300 rounded-lg cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
            <input type="radio" name="locationType" value="ALL" class="sr-only peer" checked>
            <i class="fas fa-globe text-2xl text-gray-400 peer-checked:text-blue-600 mb-2"></i>
            <span class="text-sm font-medium text-gray-700 peer-checked:text-blue-600">All venues</span>
        </label>
    </div>
</div>

<!-- Weekly Availability Table Fragment -->
<div th:fragment="weeklyAvailability" class="space-y-3">
    <h3 class="text-lg font-bold text-gray-800 mb-4">
        <i class="fas fa-calendar-week text-blue-600 mr-2"></i>
        Weekly Availability
    </h3>
    
    <div class="space-y-2">
        <div th:each="day : ${T(java.time.DayOfWeek).values()}" 
             class="flex items-center space-x-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
            <div class="flex items-center flex-1">
                <input type="checkbox" 
                       th:id="'day-' + ${day}"
                       th:name="'weeklyAvailability[' + ${day} + '].enabled'"
                       class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
                       onchange="toggleDayFields(this)">
                <label th:for="'day-' + ${day}" 
                       class="ml-3 text-sm font-medium text-gray-700 w-24"
                       th:text="${#strings.capitalize(#strings.toLowerCase(day))}">Monday</label>
            </div>
            
            <div class="flex items-center space-x-2 flex-1">
                <input type="time" 
                       th:name="'weeklyAvailability[' + ${day} + '].startTime'"
                       class="px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100"
                       value="09:00"
                       disabled>
                <span class="text-gray-500">-</span>
                <input type="time" 
                       th:name="'weeklyAvailability[' + ${day} + '].endTime'"
                       class="px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100"
                       value="17:00"
                       disabled>
            </div>
        </div>
    </div>
</div>
</body>
</html>
