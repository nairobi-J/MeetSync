<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{availability/fragments/head :: head('Setup Availability - MeetSync')}"></head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    
    <!-- Main Container -->
    <div class="min-h-screen py-8 px-4">
        <div class="max-w-7xl mx-auto">
            
            <!-- Header -->
            <div class="mb-8">
                <a href="/dashboard" class="text-blue-600 hover:text-blue-800 font-medium mb-4 inline-block">
                    <i class="fas fa-arrow-left mr-2"></i>
                    Back to Dashboard
                </a>
                <h1 class="text-4xl font-bold text-gray-800">
                    <i class="fas fa-calendar-check text-blue-600"></i>
                    Setup Your Availability
                </h1>
                <p class="text-gray-600 mt-2">Configure your meeting preferences and available time slots</p>
            </div>

            <!-- Alerts -->
            <div th:if="${success}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6 rounded-md shadow-md">
                <div class="flex items-center">
                    <i class="fas fa-check-circle mr-3 text-xl"></i>
                    <p th:text="${success}">Success message</p>
                </div>
            </div>

            <div th:if="${error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-md shadow-md">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle mr-3 text-xl"></i>
                    <p th:text="${error}">Error message</p>
                </div>
            </div>

            <form th:action="@{/availability/setup}" th:object="${availabilityRequest}" method="post">
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <!-- Left Panel - Settings -->
                    <div class="lg:col-span-2 space-y-6">
                        
                        <!-- Basic Settings Card -->
                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <h2 class="text-xl font-bold text-gray-800 mb-6">
                                <i class="fas fa-cog text-blue-600 mr-2"></i>
                                Event Settings
                            </h2>
                            
                            <div class="space-y-4">
                                <!-- Event Name -->
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Event Name</label>
                                    <input type="text" 
                                           name="eventName"
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                           placeholder="30 Minute Meeting">
                                </div>

                                <!-- Duration and Timezone -->
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Duration</label>
                                        <select th:field="*{meetingDurationMinutes}"
                                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                            <option th:each="duration : ${durations}" 
                                                    th:value="${duration}" 
                                                    th:text="${duration + ' mins'}"
                                                    th:selected="${duration == 30}">30 mins</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Time Zone</label>
                                        <select th:field="*{timezone}"
                                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                            <option th:each="tz : ${timezones}" 
                                                    th:value="${tz}" 
                                                    th:text="${tz}">GMT +6 BDT</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Location -->
                                <div th:replace="~{availability/fragments/components :: locationOptions}"></div>

                                <!-- Date Range and Reminder -->
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Date range</label>
                                        <select th:field="*{futureDaysAllowed}"
                                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                            <option value="30">30 Calendar days</option>
                                            <option value="60" selected>60 Calendar days</option>
                                            <option value="90">90 Calendar days</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">Reminder</label>
                                        <select name="reminderHours"
                                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                            <option value="1">1 hour before</option>
                                            <option value="2" selected>2 hours before</option>
                                            <option value="24">24 hours before</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Time Range -->
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-3">Time-range</label>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="text-xs text-gray-600 mb-1 block">Not Earlier Than</label>
                                            <input type="time" 
                                                   name="defaultStartTime"
                                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                                   value="10:00">
                                        </div>
                                        <div>
                                            <label class="text-xs text-gray-600 mb-1 block">Not Later Than</label>
                                            <input type="time" 
                                                   name="defaultEndTime"
                                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                                   value="17:30">
                                        </div>
                                    </div>
                                </div>

                                <!-- Buffer Time -->
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                                        Buffer Time Between Meetings
                                    </label>
                                    <select th:field="*{bufferTimeMinutes}"
                                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                        <option value="0">No buffer</option>
                                        <option value="15">15 minutes</option>
                                        <option value="30">30 minutes</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Weekly Availability Card -->
                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <div th:replace="~{availability/fragments/components :: weeklyAvailability}"></div>
                        </div>

                        <!-- Override Dates Settings -->
                        <div id="overrideDatesSection" class="bg-white rounded-lg shadow-lg p-6">
                            <h3 class="text-lg font-bold text-gray-800 mb-4">
                                <i class="fas fa-calendar-plus text-purple-600 mr-2"></i>
                                Override Specific Dates
                            </h3>
                            <p class="text-sm text-gray-600 mb-4">
                                Select dates from the calendar to set custom availability or mark as unavailable.
                            </p>
                            
                            <!-- Override entries will be added here dynamically -->
                            <div id="overrideEntriesContainer" class="space-y-3">
                                <!-- Template for override entries -->
                            </div>

                            <input type="hidden" id="dateOverridesData" name="dateOverridesJson" value="">
                        </div>

                        <!-- Submit Button -->
                        <div class="flex space-x-4">
                            <button type="submit" 
                                    class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 shadow-lg hover:shadow-xl">
                                <i class="fas fa-save mr-2"></i>
                                Create Event
                            </button>
                            <a href="/dashboard" 
                               class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-lg transition duration-200">
                                <i class="fas fa-times mr-2"></i>
                                Cancel
                            </a>
                        </div>
                    </div>

                    <!-- Right Panel - Calendar -->
                    <div class="lg:col-span-1">
                        <div class="sticky top-8">
                            <div th:replace="~{availability/fragments/components :: calendar}"></div>
                        </div>
                    </div>

                </div>
            </form>

        </div>
    </div>

    <!-- Calendar and Override Management Script -->
    <script th:inline="javascript">
        let currentDate = new Date();
        let selectedDates = new Set();
        let dateOverrides = {};

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Update month display
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
            
            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            // Add empty cells for days before month starts
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                grid.appendChild(emptyCell);
            }
            
            // Add days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                dayCell.textContent = day;
                dayCell.dataset.date = dateStr;
                
                if (selectedDates.has(dateStr)) {
                    dayCell.classList.add('selected');
                }
                
                dayCell.onclick = () => toggleDate(dateStr, dayCell);
                grid.appendChild(dayCell);
            }
        }

        function toggleDate(dateStr, element) {
            if (selectedDates.has(dateStr)) {
                selectedDates.delete(dateStr);
                element.classList.remove('selected');
                removeDateOverride(dateStr);
            } else {
                selectedDates.add(dateStr);
                element.classList.add('selected');
                addDateOverride(dateStr);
            }
            updateSelectedDatesDisplay();
        }

        function addDateOverride(dateStr) {
            const container = document.getElementById('overrideEntriesContainer');
            
            const overrideDiv = document.createElement('div');
            overrideDiv.id = `override-${dateStr}`;
            overrideDiv.className = 'p-4 bg-purple-50 border border-purple-200 rounded-lg';
            overrideDiv.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <span class="font-semibold text-gray-800">
                        <i class="fas fa-calendar-day text-purple-600 mr-2"></i>
                        ${new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}
                    </span>
                    <button type="button" onclick="removeDate('${dateStr}')" 
                            class="text-red-600 hover:text-red-800">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="space-y-2">
                    <label class="flex items-center">
                        <input type="checkbox" 
                               id="unavailable-${dateStr}"
                               onchange="toggleUnavailable('${dateStr}')"
                               class="w-4 h-4 text-purple-600 rounded focus:ring-purple-500 mr-2">
                        <span class="text-sm text-gray-700">Mark as unavailable</span>
                    </label>
                    
                    <div id="timeFields-${dateStr}" class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-600">Start Time</label>
                            <input type="time" 
                                   id="start-${dateStr}"
                                   value="09:00"
                                   onchange="updateOverrideData('${dateStr}')"
                                   class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-500">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600">End Time</label>
                            <input type="time" 
                                   id="end-${dateStr}"
                                   value="17:00"
                                   onchange="updateOverrideData('${dateStr}')"
                                   class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-500">
                        </div>
                    </div>
                </div>
            `;
            
            container.appendChild(overrideDiv);
            
            // Initialize override data
            dateOverrides[dateStr] = {
                date: dateStr,
                startTime: '09:00',
                endTime: '17:00',
                unavailable: false
            };
            updateHiddenField();
        }

        function removeDateOverride(dateStr) {
            const overrideDiv = document.getElementById(`override-${dateStr}`);
            if (overrideDiv) {
                overrideDiv.remove();
            }
            delete dateOverrides[dateStr];
            updateHiddenField();
        }

        function removeDate(dateStr) {
            selectedDates.delete(dateStr);
            removeDateOverride(dateStr);
            renderCalendar();
            updateSelectedDatesDisplay();
        }

        function toggleUnavailable(dateStr) {
            const checkbox = document.getElementById(`unavailable-${dateStr}`);
            const timeFields = document.getElementById(`timeFields-${dateStr}`);
            
            if (checkbox.checked) {
                timeFields.style.display = 'none';
                dateOverrides[dateStr].unavailable = true;
            } else {
                timeFields.style.display = 'grid';
                dateOverrides[dateStr].unavailable = false;
            }
            updateHiddenField();
        }

        function updateOverrideData(dateStr) {
            const startTime = document.getElementById(`start-${dateStr}`).value;
            const endTime = document.getElementById(`end-${dateStr}`).value;
            
            dateOverrides[dateStr].startTime = startTime;
            dateOverrides[dateStr].endTime = endTime;
            updateHiddenField();
        }

        function updateHiddenField() {
            const overridesArray = Object.values(dateOverrides);
            document.getElementById('dateOverridesData').value = JSON.stringify(overridesArray);
        }

        function updateSelectedDatesDisplay() {
            const container = document.getElementById('selectedDatesContainer');
            if (selectedDates.size > 0) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        function toggleDayFields(checkbox) {
            const container = checkbox.closest('.flex');
            const timeInputs = container.querySelectorAll('input[type="time"]');
            timeInputs.forEach(input => {
                input.disabled = !checkbox.checked;
            });
        }

        // Initialize calendar on page load
        document.addEventListener('DOMContentLoaded', function() {
            renderCalendar();
        });
    </script>

</body>
</html>
