<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{availability/fragments/head :: head('Setup Availability - MeetSync')}"></head>

<body class="bg-gray-50">

    <!-- Navigation -->
    <div th:replace="~{fragments/home_nav :: navbar}"></div>

    <!-- Main Layout with Sidebar -->
    <div class="flex">
        <!-- Sidebar -->
        <div th:replace="~{fragments/home_sidebar :: sidebar}"></div>

        <!-- Main Content Area -->
        <div class="flex-1 ml-0 mb-32 lg:ml-64 min-h-screen">
            <div class="py-8  mb-8 px-4 lg:px-8">
                <div class="max-w-7xl mx-auto ">

                    <!-- Header -->
                    <div class="mt-20 mb-6">
                        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-800">
                            <i class="fas fa-calendar-check text-blue-600"></i>
                            <span class="hidden sm:inline">Setup Your Availability</span>
                            <span class="sm:hidden">Availability Setup</span>
                        </h1>
                        <p class="text-sm sm:text-base text-gray-600 mt-2">Configure when you're available </p>
                    </div>


                    <!-- Alerts -->
                    <div th:replace="~{fragments/toast :: alerts}"></div>

                    <form th:action="@{/availability/setup}" th:object="${availabilityRequest}" method="post">

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                            <!-- Left Panel - Settings -->
                            <div class="lg:col-span-2 space-y-6">

                                <!-- Basic Settings Card -->
                                <div class="bg-white rounded-lg shadow-lg p-6">
                                    <h2 class="text-xl font-bold text-gray-800 mb-6">
                                        <i class="fas fa-cog text-blue-600 mr-2"></i>
                                        Meeting Preferences
                                    </h2>

                                    <div class="space-y-4">


                                        <!-- Duration and Timezone -->
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label
                                                    class="block text-sm font-semibold text-gray-700 mb-2">Duration</label>
                                                <select th:field="*{meetingDurationMinutes}"
                                                    class="w-full px-3 sm:px-4 py-2 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                                    <option th:each="duration : ${durations}" th:value="${duration}"
                                                        th:text="${duration + ' mins'}" th:selected="${duration == 30}">
                                                        30 mins</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label class="block text-sm font-semibold text-gray-700 mb-2">Time
                                                    Zone</label>
                                                <select th:field="*{timezone}"
                                                    class="w-full px-3 sm:px-4 py-2 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                                    <option th:each="tz : ${timezones}" th:value="${tz}"
                                                        th:text="${tz}">GMT +6 BDT</option>
                                                </select>
                                            </div>
                                        </div>

                                        <!-- Date Range and Min Notice -->
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label class="block text-sm font-semibold text-gray-700 mb-2">Date
                                                    range</label>
                                                <select th:field="*{futureDaysAllowed}"
                                                    class="w-full px-3 sm:px-4 py-2 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                                    <option value="30" selected>30 Calendar days</option>
                                                    <option value="60" >60 Calendar days</option>
                                                    <option value="90">90 Calendar days</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label class="block text-sm font-semibold text-gray-700 mb-2">Minimum
                                                    Notice</label>
                                                <select th:field="*{minNoticeHours}"
                                                    class="w-full px-3 sm:px-4 py-2 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                                    <option value="30" th:selected="${minNoticeHours == 30}">30 minutes before</option>
                                                    <option value="60" th:selected="${minNoticeHours == 60}">1 hour before</option>
                                                    <option value="120" th:selected="${minNoticeHours == 120}">2 hours before</option>
                                                    
                                                </select>
                                            </div>
                                        </div>

                                        <!-- Buffer Time -->
                                        <div>
                                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                                Buffer Time Between Meetings
                                            </label>
                                            <select th:field="*{bufferTimeMinutes}"
                                                class="w-full px-3 sm:px-4 py-2 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                                                <option value="0">No buffer</option>
                                                <option value="10">10 minutes</option>
                                                <option value="15">15 minutes</option>
                                                <option value="30">30 minutes</option>
                                            </select>
                                        </div>
                                    </div>
                                    <!-- Weekly Availability Card -->
                                    <div class=" p-6">
                                        <h3 class="text-lg font-bold text-gray-800 mb-4">
                                            <i class="fas fa-calendar-week text-blue-600 mr-2"></i>
                                            Weekly Availability
                                        </h3>

                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                            <div>
                                                <label class="block text-sm font-semibold text-gray-700 mb-1">Not
                                                    earlier than</label>
                                                <input type="time" id="globalStartTime"
                                                    class="w-full px-3 py-2 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                                    value="09:00" onchange="setAllWeeklyTimes()">
                                            </div>
                                            <div>
                                                <label class="block text-sm font-semibold text-gray-700 mb-1">Not later
                                                    than</label>
                                                <input type="time" id="globalEndTime"
                                                    class="w-full px-3 py-2 text-sm sm:text-base border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                                    value="17:00" onchange="setAllWeeklyTimes()">
                                            </div>
                                        </div>
                                        <div class="space-y-2">
                                            <div th:each="day, iterStat : ${T(java.time.DayOfWeek).values()}"
                                                class="flex flex-col sm:flex-row items-start sm:items-center space-y-2 sm:space-y-0 sm:space-x-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">

                                                <div class="flex items-center w-full sm:flex-1">
                                                    <input type="checkbox" th:id="'day-' + ${day}" th:data-day="${day}"
                                                        th:data-index="${iterStat.index}"
                                                        class="day-checkbox w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
                                                        onchange="toggleDayFields(this)">
                                                    <label th:for="'day-' + ${day}"
                                                        class="ml-3 text-sm font-medium text-gray-700 w-24"
                                                        th:text="${#strings.capitalize(#strings.toLowerCase(day))}">Monday</label>
                                                </div>

                                                <div class="flex items-center space-x-2 w-full sm:flex-1 pl-7 sm:pl-0">
                                                    <input type="time" th:id="'startTime-' + ${iterStat.index}"
                                                        class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100"
                                                        value="09:00" onchange="updateWeeklyAvailability()" disabled>
                                                    <span class="text-gray-500">-</span>
                                                    <input type="time" th:id="'endTime-' + ${iterStat.index}"
                                                        class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100"
                                                        value="17:00" onchange="updateWeeklyAvailability()" disabled>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Hidden container for weekly availability form inputs -->
                                        <div id="weeklyAvailabilityInputsContainer"></div>
                                    </div>

                                    <!-- Advanced Settings Toggle -->
                                    <div class="mt-6">
                                        <button type="button" onclick="toggleAdvancedSettings()" class="w-full flex items-center justify-between
                   bg-gray-100 hover:bg-gray-200
                   px-3 sm:px-4 py-3 rounded-lg font-semibold text-gray-700 transition">

                                            <span class="text-sm sm:text-base">
                                                <i class="fas fa-sliders-h mr-2 text-blue-600"></i>
                                                <span class="hidden sm:inline">Advanced Settings (Select Specific Date & Time)</span>
                                                <span class="sm:hidden">Advanced Settings</span>
                                            </span>

                                            <svg id="advancedArrow" class="w-5 h-5 flex-shrink-0 transition-transform duration-300"
                                                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M19 9l-7 7-7-7" />
                                            </svg>
                                        </button>

                                        <!-- Advanced Settings Collapsible -->
                                        <div id="advancedSettings"
                                            class="hidden mt-4 overflow-hidden transition-all duration-300">

                                            <!-- Calendar -->
                                            <div class="mb-6">
                                                <div th:replace="~{availability/fragments/components :: calendar}"></div>
                                            </div>

                                            <!-- Override Dates Settings -->
                                            <div id="overrideDatesSection" class="bg-white rounded-lg shadow-lg p-6">
                                                <h3 class="text-lg font-bold text-gray-800 mb-4">
                                                    Override Specific Dates
                                                </h3>
                                                <p class="text-sm text-gray-600 mb-4">
                                                    Select dates from the calendar to set custom availability or mark as
                                                    unavailable.
                                                </p>

                                                <!-- Override entries will be added here dynamically -->
                                                <div id="overrideEntriesContainer" class="space-y-3">
                                                    <!-- Template for override entries -->
                                                </div>

                                                <!-- Hidden container for actual form inputs -->
                                                <div id="dateOverridesInputsContainer"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>



                                <!-- Submit Button -->
                                <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                                    <button type="submit" id="saveAvailabilityBtn"
                                        class="flex-1 bg-gradient-to-r from-blue-600 to-blue-600 hover:from-blue-700 hover:to-blue-700 text-white font-bold py-3 px-4 sm:px-6 rounded-lg transition duration-200 shadow-lg hover:shadow-xl flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed text-sm sm:text-base">
                                        <svg id="saveLoadingSpinner" class="hidden animate-spin -ml-1 mr-2 sm:mr-3 h-4 w-4 sm:h-5 sm:w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        <i id="saveIcon" class="fas fa-save mr-2"></i>
                                        <span id="saveBtnText">Save Availability</span>
                                    </button>
                                    <a href="/dashboard"
                                        class="w-full sm:w-auto text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 sm:px-6 rounded-lg transition duration-200 text-sm sm:text-base">
                                        <i class="fas fa-times mr-2"></i>
                                        Cancel
                                    </a>
                                </div>
                            </div>

                            <!-- Right Panel - Personal Link -->
                            <div class="lg:col-span-1" th:classappend="${success} ? '' : 'hidden'">
                                <!-- Booking Link Section -->
                                <div th:if="${bookingLink}" class="bg-white rounded-lg shadow-lg p-4 sm:p-6 lg:sticky lg:top-8">
                                    <h3 class="text-base sm:text-lg font-bold text-gray-800 mb-3 sm:mb-4">
                                        <i class="fas fa-link text-blue-600 mr-2"></i>
                                        Personal Link
                                    </h3>
                                    <div class="space-y-1">
                                        <div>
                                            <label class="block text-xs font-semibold text-gray-500 mb-2">
                                                Share your link to others to let them book meetings with you
                                            </label>
                                            <input type="text" 
                                                   th:value="${bookingLink}"
                                                   id="bookingLinkInput"
                                                   readonly
                                                   class="w-full px-3 sm:px-4 py-2 text-blue-600 text-xs sm:text-sm font-mono break-all">
                                        </div>
                                        <div class="flex flex-col space-y-2">
                                            <button type="button" onclick="copyBookingLink()" 
                                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white px-3 sm:px-4 py-2 rounded-lg transition shadow-md hover:shadow-lg text-sm sm:text-base">
                                                <i class="fas fa-copy mr-2"></i>Copy Link
                                            </button>
                                            <a th:href="${bookingLink}" 
                                               target="_blank"
                                               class="w-full bg-gray-600 hover:bg-gray-700 text-white px-3 sm:px-4 py-2 rounded-lg transition shadow-md hover:shadow-lg inline-flex items-center justify-center text-sm sm:text-base">
                                                <i class="fas fa-external-link-alt mr-2"></i>Preview
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Load external JavaScript file -->
    <script th:src="@{/js/setupAvailability.js}"></script>
    <script th:src="@{/js/sidebar_toggle.js}" defer></script>
    <!-- Calendar and Override Management Script -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const weeklyAvailabilityData = /*[[${availabilityRequest.weeklyAvailability}]]*/[];
        const dateOverridesData = /*[[${availabilityRequest.dateOverrides}]]*/[];
        
        // Set the data from Thymeleaf
        setExistingData(weeklyAvailabilityData, dateOverridesData);
        /*]]>*/
    </script>






    <style>
        .calendar-day {
            @apply text-center py-2 cursor-pointer transition;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 2.5rem;
            
            
        }

        .calendar-day:hover {
            @apply bg-blue-50;
        }

        .calendar-day.selected {
            @apply font-bold;
            background: transparent;
            color: white !important;
            position: relative;
            z-index: 1;
        }

        .calendar-day.selected::before {
            content: '';
            position: absolute;
            width: 2.25rem;
            height: 2.25rem;
            background-color: #3b82f6;
            border-radius: 50%;
            z-index: -1;
            transition: all 0.2s ease;
        }

        .calendar-day.selected:hover::before {
            background-color: #2563eb;
            transform: scale(1.05);
        }
    </style>

    <script>
        function copyBookingLink() {
            const input = document.getElementById('bookingLinkInput');
            if (input) {
                input.select();
                input.setSelectionRange(0, 99999); // For mobile devices
                
                // Modern clipboard API
                navigator.clipboard.writeText(input.value).then(() => {
                    const button = event.target.closest('button');
                    const originalHTML = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-check mr-2"></i>Copied!';
                    button.classList.add('bg-green-600');
                    button.classList.remove('bg-blue-600');
                    
                    setTimeout(() => {
                        button.innerHTML = originalHTML;
                        button.classList.remove('bg-green-600');
                        button.classList.add('bg-blue-600');
                    }, 2000);
                }).catch(() => {
                    // Fallback for older browsers
                    document.execCommand('copy');
                    alert('Link copied to clipboard!');
                });
            }
        }
    </script>

</body>

</html>
