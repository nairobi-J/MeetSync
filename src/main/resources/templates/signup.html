
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MeetSync - Sign Up</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #1a73e8; /* Blue */
            margin-bottom: 10px;
        }
        .login-title {
            font-size: 24px;
            font-weight: bold;
            color: #1a73e8; /* Bold blue */
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Important for width */
            font-size: 16px;
        }
        .btn-signin {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-signin:hover { background-color: #1557b0; }

        .signup-link {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .signup-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }

        .divider {
            margin: 25px 0;
            display: flex;
            align-items: center;
            color: #888;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        .divider span { padding: 0 10px; font-size: 14px; }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background-color: white;
            color: black;
            border: 1px solid black; /* Black border as requested */
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-google:hover { background-color: #f8f8f8; }

        .msg { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-name">MeetSync</div>
    <div class="login-title" style="color: #1a73e8; font-weight: bold;">Sign Up</div>

    <p>To ensure secure calendar sync, please create your account using Google.</p>

    <a th:href="@{/oauth2/authorization/google}" class="btn-google">
        Sign up with Google
    </a>

    <div class="signup-link">
        Already have an account? <a th:href="@{/login}">Log in</a>
    </div>
</div>

</body>
</html>
