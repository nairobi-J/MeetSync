
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MeetSync - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #1a73e8; /* Blue */
            margin-bottom: 10px;
        }
        .login-title {
            font-size: 24px;
            font-weight: bold;
            color: #1a73e8; /* Bold blue */
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Important for width */
            font-size: 16px;
        }
        .btn-signin {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-signin:hover { background-color: #1557b0; }

        .signup-link {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .signup-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }

        .divider {
            margin: 25px 0;
            display: flex;
            align-items: center;
            color: #888;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        .divider span { padding: 0 10px; font-size: 14px; }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background-color: white;
            color: black;
            border: 1px solid black; /* Black border as requested */
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-google:hover { background-color: #f8f8f8; }

        /* Error/Success Messages */
        .msg { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-name">MeetSync</div>
    <div class="login-title">Log in</div>

    <!-- Alert messages for login error or signup success -->
    <div th:if="${param.error}" class="msg error">Invalid email or password.</div>
    <div th:if="${param.success}" class="msg success">Log In successful!</div>
    <div th:if="${param.deleted}" class="msg" style="background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b;">
        Your account has been successfully deleted. Thank you for using MeetSync.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="username" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-signin">Log In</button>
    </form>

    <div class="signup-link">
        Didn't have an account? <a th:href="@{/signup}">Sign Up</a>
    </div>

    <div class="divider"><span>OR</span></div>

    <!-- The Google Button -->
    <a th:href="@{/oauth2/authorization/google}" class="btn-google">
        Sign in with Google
    </a>
</div>

</body>
</html>
