<div class="login-card">
    <div class="brand-name">MeetSync</div>
    <div class="login-title">Set Your Password</div>
    <p>Set a password to log in from any device without Google.</p>

    <form th:action="@{/api/users/set-password}" method="post">
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" required minlength="6">
        </div>
        <button type="submit" class="btn-signin">Save Password</button>
    </form>
</div>
